<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca SEMSAD - Iniciar Sesión</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .card-login { 
            width: 100%; 
            max-width: 420px; 
            border-radius: 16px; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-login shadow-lg border-0 bg-white p-4">
                <div class="text-center mb-4">
                    <h4 class="fw-bold text-dark mb-1">Bienvenido a la biblioteca</h4>
                    <h4 class="fw-bold text-dark mb-0">SEMSAD</h4>
                </div>

                <div id="alertContainer"></div>

                <form id="formLogin">
                    <div class="mb-3">
                        <input type="email" id="loginCorreo" class="form-control py-2 px-3" placeholder="Correo institucional" required>
                    </div>

                    <div class="mb-3">
                        <input type="password" id="loginContrasena" class="form-control py-2 px-3" placeholder="Contraseña" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3 rounded-pill fs-6" id="btnAcceder">
                        Acceder
                    </button>

                    <div class="text-center mb-2">
                        <a href="recuperar.html" class="text-decoration-none small fw-semibold text-primary">
                            🔑 ¿Olvidaste tu contraseña?
                        </a>
                    </div>

                    <div class="text-center">
                        <span class="small text-muted me-1">📝 ¿No tienes cuenta?</span>
                        <a href="registro.html" class="text-decoration-none small fw-bold text-primary">Regístrate</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('formLogin').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const alertContainer = document.getElementById('alertContainer');
        const btn = document.getElementById('btnAcceder');
        const correo = document.getElementById('loginCorreo').value.trim();
        const contrasena = document.getElementById('loginContrasena').value.trim();

        if (!correo || !contrasena) {
            alertContainer.innerHTML = `<div class="text-danger small text-center mb-3">Ingrese su correo y contraseña.</div>`;
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Accediendo...';
        alertContainer.innerHTML = '';

        try {
            const resp = await fetch('../api/login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo: correo, contrasena: contrasena })
            });

            const rawText = await resp.text();
            let res;
            
            try {
                res = JSON.parse(rawText);
            } catch(jsonErr) {
                alertContainer.innerHTML = `<div class="text-danger small text-center mb-3">Respuesta no válida del servidor.</div>`;
                btn.disabled = false;
                btn.innerHTML = 'Acceder';
                return;
            }

            if (res.status === 'success') {
                alertContainer.innerHTML = `<div class="alert alert-success small py-2 text-center">${res.mensaje}</div>`;
                setTimeout(() => {
                    window.location.href = res.redirect;
                }, 800);
            } else {
                alertContainer.innerHTML = `<div class="text-danger small text-center mb-3 fw-semibold">${res.mensaje}</div>`;
                btn.disabled = false;
                btn.innerHTML = 'Acceder';
            }
        } catch (err) {
            alertContainer.innerHTML = `<div class="text-danger small text-center mb-3">No se pudo conectar con el servidor. Intente nuevamente.</div>`;
            btn.disabled = false;
            btn.innerHTML = 'Acceder';
        }
    });
</script>
</body>
</html>
