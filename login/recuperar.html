<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - SEMSAD</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .contenedor { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            box-sizing: border-box;
        }
        h2 { 
            color: #333; 
            margin-bottom: 8px; 
            margin-top: 0;
        }
        p.descripcion {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box;
            font-size: 14px;
        }

        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #1d4ed8; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        button:hover, button:active { 
            background-color: #2563eb; 
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
        }

        button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }

        .enlaces { 
            margin-top: 22px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            align-items: center; 
        }

        .bubble-link { 
            text-decoration: none; 
            color: #1d4ed8; 
            font-weight: 600;
            padding: 6px 14px; 
            border-radius: 20px; 
            transition: all 0.2s ease-in-out; 
            display: inline-block;
            user-select: none;
        }

        .bubble-link:hover, 
        .bubble-link:active, 
        .bubble-link:focus { 
            background-color: #e0e7ff; 
            color: #1d4ed8; 
            transform: scale(1.05); 
            outline: none;
        }

        #recuperar-mensaje {
            margin-top: 15px;
            font-size: 14px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .msg-success {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .msg-error {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>
    <main>
        <div class="contenedor">
            <h2>Recuperar Contraseña</h2>
            <p class="descripcion">Ingresa tu correo institucional o código para verificar tu cuenta.</p>

            <form id="form-recuperar">
                <input type="text" placeholder="Correo electrónico o código" id="correo_recuperar" required>
                <button type="submit" id="btn-enviar">Enviar Instrucciones</button>
            </form>

            <div id="recuperar-mensaje"></div>

            <div class="enlaces">
                <a href="index.html" class="bubble-link">← Volver al Inicio de Sesión</a>
            </div> 
        </div>    
    </main>

    <script src="../js/config.js"></script>

    <script>
        document.getElementById('form-recuperar').addEventListener('submit', async function(e) {
            e.preventDefault();

            const correoInput = document.getElementById('correo_recuperar').value.trim();
            const btn = document.getElementById('btn-enviar');
            const mensajeDiv = document.getElementById('recuperar-mensaje');

            function mostrar(texto, clase) {
                mensajeDiv.style.display = 'block';
                mensajeDiv.className = clase;
                mensajeDiv.textContent = texto;
            }

            if (!correoInput) {
                mostrar('Por favor, ingresa tu correo o código.', 'msg-error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verificando...';
            mensajeDiv.style.display = 'none';

            try {
                const resp = await fetch(`${window.SEMSAD_API}/solicitar_recuperacion.php`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ correo: correoInput })
                });
                const data = JSON.parse(await resp.text());

                if (data.status === 'success') {
                    mostrar(data.mensaje || 'Instrucciones enviadas correctamente.', 'msg-success');
                    document.getElementById('form-recuperar').reset();
                } else {
                    mostrar(data.mensaje || 'No se encontró la cuenta ingresada.', 'msg-error');
                }
            } catch (err) {
                console.error('Error en la recuperación:', err);
                mostrar('No se pudo conectar con el servidor. Inténtalo de nuevo en un momento.', 'msg-error');
            }

            btn.disabled = false;
            btn.textContent = 'Enviar Instrucciones';
        });
    </script>
</body>
</html>
