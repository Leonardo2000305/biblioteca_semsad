<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Recuperar Contraseña - SEMSAD</title>
 <link rel="stylesheet" href="../css/index.css">
 <style>
    body { 
        font-family: Arial, sans-serif; 
        background-color: #f4f7f6; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        margin: 0; 
    }
    .contenedor { 
        background: white; 
        padding: 40px; 
        border-radius: 12px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        width: 100%; 
        max-width: 400px; 
        text-align: center; 
        box-sizing: border-box;
    }
    h2 { 
        color: #333; 
        margin-bottom: 8px; 
        margin-top: 0;
    }
    p.descripcion {
        color: #555;
        font-size: 14px;
        margin-bottom: 20px;
        line-height: 1.4;
    }
    
    input { 
        width: 100%; 
        padding: 12px; 
        margin-bottom: 15px; 
        border: 1px solid #ccc; 
        border-radius: 6px; 
        box-sizing: border-box;
        font-size: 14px;
    }
    
    button { 
        width: 100%; 
        padding: 12px; 
        background-color: #1d4ed8; 
        color: white; 
        border: none; 
        border-radius: 25px; 
        font-size: 16px; 
        font-weight: bold;
        cursor: pointer; 
        transition: all 0.2s ease;
    }
    button:hover, button:active { 
        background-color: #2563eb; 
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
    }
    
    .enlaces { 
        margin-top: 22px; 
        display: flex; 
        flex-direction: column; 
        gap: 8px; 
        align-items: center; 
    }

    .bubble-link { 
        text-decoration: none; 
        color: #1d4ed8; 
        font-weight: 600;
        padding: 6px 14px; 
        border-radius: 20px; 
        transition: all 0.2s ease-in-out; 
        display: inline-block;
        user-select: none;
    }
    
    .bubble-link:hover, 
    .bubble-link:active, 
    .bubble-link:focus { 
        background-color: #e0e7ff; 
        color: #1d4ed8; 
        transform: scale(1.05); 
        outline: none;
    }
 </style>
</head>
<body>
 <main>
    <div class="contenedor">
        <h2>Recuperar Contraseña</h2>
        <p class="descripcion">Ingresa tu correo institucional o código de empleado para verificar tu cuenta.</p>
        
        <form id="form-recuperar">
            <input type="email" placeholder="Correo electrónico institucional" id="correo_recuperar" required>
            <button type="submit">Enviar Instrucciones</button>
        </form>
        
        <div id="recuperar-mensaje" style="margin-top: 15px; font-size: 14px; display: none;"></div>
        
        <div class="enlaces">
            <a href="index.html" class="bubble-link">← Volver al Inicio de Sesión</a>
        </div> 
    </div>    
 </main>
</body>
</html>
