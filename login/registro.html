<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca SEMSAD - Registro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para Íconos y Ojitos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #1e293b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card-registro {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 520px;
            width: 100%;
            padding: 32px 28px;
        }
        .avatar-icon {
            width: 72px;
            height: 72px;
            background-color: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px auto;
        }
        .form-label {
            font-weight: 700;
            font-size: 0.85rem;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .input-group-text {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            color: #64748b;
        }
        .form-control {
            border-color: #cbd5e1;
            padding: 10px 12px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-eye {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #64748b;
            border-left: none;
        }
        .btn-eye:hover {
            background-color: #e2e8f0;
            color: #1e293b;
        }
        .btn-enviar {
            border: 2px solid #2563eb;
            color: #2563eb;
            background-color: transparent;
            font-weight: 700;
            border-radius: 8px;
            padding: 10px;
            transition: all 0.2s ease;
        }
        .btn-enviar:hover {
            background-color: #2563eb;
            color: #ffffff;
        }
        .btn-confirmar {
            background-color: #16a34a;
            color: #ffffff;
            font-weight: 700;
            border-radius: 8px;
            padding: 10px;
            border: none;
        }
        .btn-confirmar:hover {
            background-color: #15803d;
        }
