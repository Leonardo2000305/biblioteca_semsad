<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca SEMSAD - Registro de Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body {
            background-color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .card-register {
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-register shadow-lg border-0 bg-white p-4">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                        <i class="fa-solid fa-user-plus fa-xl"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Crear Cuenta Estudiante</h4>
                    <p class="text-muted small">Biblioteca SEMSAD</p>
                </div>

                <div id="alertContainer"></div>

                <form id="formRegistro">
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-bold">Nombres</label>
                            <input type="text" id="regNombres" class="form-control" placeholder="Ej. Juan" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold">Apellidos</label>
                            <input type="text" id="regApellidos" class="form-control" placeholder="Ej. Pérez" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Correo Institucional</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" id="regCorreo" class="form-control" placeholder="usuario@est.semsad.edu.bo" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">CI / Código Estudiantil</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
                            <input type="text" id="regCodigo" class="form-control" placeholder="Ej. EST-202409" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3" id="btnRegistrar">
                        <i class="fa-solid fa-user-check me-2"></i>Registrarse
                    </button>

                    <div class="text-center">
                        <a href="index.html" class="text-decoration-none small text-secondary">
                            <i class="fa-solid fa-arrow-left me-1"></i> Volver a Iniciar Sesión
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('formRegistro').addEventListener('submit', async function(e) {
        e.preventDefault();
        const alertContainer = document.getElementById('alertContainer');
        const btn = document.getElementById('btnRegistrar');
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Registrando...';
        alertContainer.innerHTML = '';

        const datos = {
            nombres: document.getElementById('regNombres').value.trim(),
            apellidos: document.getElementById('regApellidos').value.trim(),
            correo: document.getElementById('regCorreo').value.trim(),
            codigo_empleado: document.getElementById('regCodigo').value.trim(),
            password: document.getElementById('regPassword').value.trim()
        };

        try {
            const response = await fetch('../api/registrar_usuario.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            
            const res = await response.json();

            if (res.status === 'success') {
                alertContainer.innerHTML = `<div class="alert alert-success small py-2"><i class="fa-solid fa-circle-check me-1"></i>${res.mensaje} Redirigiendo al login...</div>`;
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } else {
                alertContainer.innerHTML = `<div class="alert alert-danger small py-2"><i class="fa-solid fa-circle-xmark me-1"></i>${res.mensaje}</div>`;
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-check me-2"></i>Registrarse';
            }
        } catch (err) {
            alertContainer.innerHTML = `<div class="alert alert-danger small py-2"><i class="fa-solid fa-wifi me-1"></i>Error de conexión al servidor.</div>`;
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-user-check me-2"></i>Registrarse';
        }
    });
</script>
</body>
</html>
