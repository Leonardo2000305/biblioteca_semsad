<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Biblioteca SEMSAD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 420px; padding: 32px; text-align: center; }
        h1 { color: #1e3a8a; font-size: 22px; margin-bottom: 8px; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
        .correo-badge { background-color: #eff6ff; color: #1d4ed8; padding: 6px 12px; border-radius: 20px; font-weight: 600; display: inline-block; margin-bottom: 20px; font-size: 13px; word-break: break-all; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper input {
            width: 100%;
            padding: 10px 42px 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-wrapper input:focus {
            border-color: #2563eb;
        }
        
        .btn-eye {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 4px;
            transition: color 0.2s;
        }
        .btn-eye:hover {
            color: #1d4ed8;
        }

        .btn-submit { width: 100%; background-color: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
        .btn-submit:hover { background-color: #1d4ed8; }
        .btn-submit:disabled { background-color: #93c5fd; cursor: not-allowed; }
        
        .msg-alert { padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 15px; display: none; word-break: break-word; }
        .msg-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
        .msg-success { background-color: #dcfce7; color: #166534; border: 1px solid #4ade80; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Restablecer Contraseña</h1>
        <p>Ingresa tu nueva contraseña para tu cuenta de la Biblioteca SEMSAD.</p>

        <div id="badgeCorreo" class="correo-badge" style="display: none;"></div>

        <form id="formRestablecer">
            <div class="form-group">
                <label for="nuevaPassword">Nueva Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="nuevaPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                    <button type="button" class="btn-eye" onclick="togglePassword('nuevaPassword', this)" title="Mostrar u ocultar contraseña">
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmarPassword">Confirmar Nueva Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmarPassword" placeholder="Repite tu nueva contraseña" required minlength="6">
                    <button type="button" class="btn-eye" onclick="togglePassword('confirmarPassword', this)" title="Mostrar u ocultar contraseña">
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">Guardar Nueva Contraseña</button>
        </form>

        <div id="mensajeBox" class="msg-alert"></div>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';

            if (isPassword) {
                btn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908A10.003 10.003 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" />
                    </svg>
                `;
            } else {
                btn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const correo = params.get('correo') || '';
            const codigo = params.get('codigo') || '';

            const badgeCorreo = document.getElementById('badgeCorreo');
            const mensajeBox = document.getElementById('mensajeBox');
            const form = document.getElementById('formRestablecer');

            if (correo) {
                badgeCorreo.textContent = correo;
                badgeCorreo.style.display = 'inline-block';
            }

            if (!correo || !codigo) {
                mostrarMensaje('Enlace inválido o incompleto. Solicita una nueva recuperación.', 'error');
                form.style.display = 'none';
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const pass1 = document.getElementById('nuevaPassword').value.trim();
                const pass2 = document.getElementById('confirmarPassword').value.trim();

                if (pass1 !== pass2) {
                    mostrarMensaje('Las contraseñas no coinciden. Verifícalas.', 'error');
                    return;
                }

                if (pass1.length < 6) {
                    mostrarMensaje('La contraseña debe tener al menos 6 caracteres.', 'error');
                    return;
                }

                const btnSubmit = document.getElementById('btnSubmit');
                btnSubmit.disabled = true;
                btnSubmit.textContent = 'Guardando...';

                const payload = {
                    correo: correo,
                    codigo: codigo,
                    password: pass1
                };

                const endpoints = [
                    'https://bibliosemsad.alwaysdata.net/api/restablecer_contrasena.php',
                    'https://biblioteca-semsad.alwaysdata.net/api/restablecer_contrasena.php',
                    'https://bibliotecasemsad.alwaysdata.net/api/restablecer_contrasena.php',
                    'https://semsad.alwaysdata.net/api/restablecer_contrasena.php',
                    'https://leogutisp.alwaysdata.net/api/restablecer_contrasena.php',
                    '../api/restablecer_contrasena.php',
                    '/api/restablecer_contrasena.php'
                ];

                let respuestaValida = null;
                let errorServidor = '';

                for (const url of endpoints) {
                    try {
                        const res = await fetch(url, {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });

                        const text = await res.text();
                        let json = null;
                        try {
                            json = JSON.parse(text);
                        } catch (e) {
                            if (text && text.trim().length > 0) {
                                errorServidor = text.substring(0, 150);
                            }
                        }

                        if (json && (json.status === 'success' || json.status === 'error')) {
                            respuestaValida = json;
                            break;
                        } else if (json && json.mensaje) {
                            respuestaValida = { status: 'error', mensaje: json.mensaje };
                            break;
                        }
                    } catch (err) {
                        console.warn('Endpoint falló:', url, err);
                        if (!errorServidor) {
                            errorServidor = err.message || '';
                        }
                    }
                }

                if (respuestaValida && respuestaValida.status === 'success') {
                    mostrarMensaje('¡Éxito! ' + respuestaValida.mensaje, 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else if (respuestaValida && respuestaValida.status === 'error') {
                    mostrarMensaje(respuestaValida.mensaje, 'error');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Guardar Nueva Contraseña';
                } else {
                    mostrarMensaje(errorServidor || 'No se pudo conectar con el servidor backend en Alwaysdata.', 'error');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Guardar Nueva Contraseña';
                }
            });

            function mostrarMensaje(texto, tipo) {
                mensajeBox.textContent = texto;
                mensajeBox.className = 'msg-alert ' + (tipo === 'success' ? 'msg-success' : 'msg-error');
                mensajeBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
