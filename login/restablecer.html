<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Biblioteca SEMSAD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 420px; padding: 32px; text-align: center; }
        h1 { color: #1e3a8a; font-size: 22px; margin-bottom: 8px; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
        .correo-badge { background-color: #eff6ff; color: #1d4ed8; padding: 6px 12px; border-radius: 20px; font-weight: 600; display: inline-block; margin-bottom: 20px; font-size: 13px; word-break: break-all; }
        .form-group { text-align: left; margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #2563eb; }
        button { width: 100%; background-color: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #93c5fd; cursor: not-allowed; }
        .msg-alert { padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 15px; display: none; }
        .msg-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
        .msg-success { background-color: #dcfce7; color: #166534; border: 1px solid #4ade80; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Restablecer Contraseña</h1>
        <p>Ingresa tu nueva contraseña para tu cuenta de la Biblioteca SEMSAD.</p>

        <!-- Correo detectado de la URL -->
        <div id="badgeCorreo" class="correo-badge" style="display: none;"></div>

        <form id="formRestablecer">
            <div class="form-group">
                <label for="nuevaPassword">Nueva Contraseña</label>
                <input type="password" id="nuevaPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmarPassword">Confirmar Nueva Contraseña</label>
                <input type="password" id="confirmarPassword" placeholder="Repite tu nueva contraseña" required minlength="6">
            </div>

            <button type="submit" id="btnSubmit">Guardar Nueva Contraseña</button>
        </form>

        <div id="mensajeBox" class="msg-alert"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Obtener parámetros de la URL (?correo=...&codigo=...)
            const params = new URLSearchParams(window.location.search);
            const correo = params.get('correo') || '';
            const codigo = params.get('codigo') || '';

            const badgeCorreo = document.getElementById('badgeCorreo');
            const mensajeBox = document.getElementById('mensajeBox');
            const form = document.getElementById('formRestablecer');

            // Mostrar el correo en pantalla si está presente
            if (correo) {
                badgeCorreo.textContent = correo;
                badgeCorreo.style.display = 'inline-block';
            }

            // Validar que la URL tenga datos válidos
            if (!correo || !codigo) {
                mostrarMensaje('Enlace inválido o incompleto. Solicita una nueva recuperación.', 'error');
                form.style.display = 'none';
                return;
            }

            // 2. Procesar el envío de la nueva contraseña
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const pass1 = document.getElementById('nuevaPassword').value.trim();
                const pass2 = document.getElementById('confirmarPassword').value.trim();

                if (pass1 !== pass2) {
                    mostrarMensaje('Las contraseñas no coinciden. Verifícalas.', 'error');
                    return;
                }

                if (pass1.length < 6) {
                    mostrarMensaje('La contraseña debe tener al menos 6 caracteres.', 'error');
                    return;
                }

                const btnSubmit = document.getElementById('btnSubmit');
                btnSubmit.disabled = true;
                btnSubmit.textContent = 'Guardando...';

                try {
                    const res = await fetch('api/restablecer_contrasena.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            correo: correo,
                            codigo: codigo,
                            password: pass1
                        })
                    });

                    const data = await res.json();

                    if (data.status === 'success') {
                        mostrarMensaje('¡Éxito! ' + data.mensaje, 'success');
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);
                    } else {
                        mostrarMensaje(data.mensaje || 'Ocurrió un error al actualizar.', 'error');
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = 'Guardar Nueva Contraseña';
                    }
                } catch (err) {
                    mostrarMensaje('Error de conexión con el servidor.', 'error');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Guardar Nueva Contraseña';
                }
            });

            function mostrarMensaje(texto, tipo) {
                mensajeBox.textContent = texto;
                mensajeBox.className = 'msg-alert ' + (tipo === 'success' ? 'msg-success' : 'msg-error');
                mensajeBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
