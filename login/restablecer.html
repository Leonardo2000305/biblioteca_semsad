<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Biblioteca SEMSAD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 420px; padding: 32px; text-align: center; }
        h1 { color: #1e3a8a; font-size: 22px; margin-bottom: 8px; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
        .correo-badge { background-color: #eff6ff; color: #1d4ed8; padding: 6px 12px; border-radius: 20px; font-weight: 600; display: inline-block; margin-bottom: 20px; font-size: 13px; word-break: break-all; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper input {
            width: 100%;
            padding: 10px 42px 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-wrapper input:focus {
            border-color: #2563eb;
        }
        
        .btn-eye {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 4px;
            transition: color 0.2s;
        }
        .btn-eye:hover {
            color: #1d4ed8;
        }

        .btn-submit { width: 100%; background-color: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
        .btn-submit:hover { background-color: #1d4ed8; }
        .btn-submit:disabled { background-color: #93c5fd; cursor: not-allowed; }
        
        .msg-alert { padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 15px; display: none; word-break: break-word; }
        .msg-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
        .msg-success { background-color: #dcfce7; color: #166534; border: 1px solid #4ade80; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Restablecer Contraseña</h1>
        <p>Ingresa tu nueva contraseña para tu cuenta de la Biblioteca SEMSAD.</p>

        <div id="badgeCorreo" class="correo-badge" style="display: none;"></div>

        <form id="formRestablecer">
            <div class="form-group">
                <label for="nuevaPassword">Nueva Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="nuevaPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                    <button type="button" class="btn-eye" onclick="togglePassword('nuevaPassword', this)" title="Mostrar u ocultar contraseña">
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmarPassword">Confirmar Nueva Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmarPassword" placeholder="Repite tu nueva contraseña" required minlength="6">
                    <button type="button" class="btn-eye" onclick="togglePassword('confirmarPassword', this)" title="Mostrar u ocultar contraseña">
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">Guardar Nueva Contraseña</button>
        </form>

        <div id="mensajeBox" class="msg-alert"></div>
    </div>

    <script src="../js/config.js"></script>
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const ver = input.type === 'password';
            input.type = ver ? 'text' : 'password';
            btn.setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña');
            btn.style.opacity = ver ? '1' : '0.7';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const correo = (params.get('correo') || '').trim();
            const token  = (params.get('token') || '').trim();

            const badgeCorreo = document.getElementById('badgeCorreo');
            const mensajeBox  = document.getElementById('mensajeBox');
            const form        = document.getElementById('formRestablecer');

            function mostrarMensaje(texto, tipo, enlaceNuevo) {
                mensajeBox.textContent = texto;
                mensajeBox.className = 'msg-alert ' + (tipo === 'success' ? 'msg-success' : 'msg-error');
                mensajeBox.style.display = 'block';
                if (enlaceNuevo) {
                    const a = document.createElement('a');
                    a.href = 'recuperar.html';
                    a.textContent = ' Pedir un enlace nuevo';
                    a.style.fontWeight = '700';
                    mensajeBox.appendChild(a);
                }
                SEMSAD.toast(texto, tipo === 'success' ? 'success' : 'error', 6000);
            }

            if (correo) {
                badgeCorreo.textContent = correo;   // textContent: el correo viene de la URL, no es de fiar
                badgeCorreo.style.display = 'inline-block';
            }

            if (!correo || !token) {
                mostrarMensaje('Enlace inválido o incompleto.', 'error', true);
                form.style.display = 'none';
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const pass1 = document.getElementById('nuevaPassword').value;   // sin trim: la contraseña se guarda tal cual
                const pass2 = document.getElementById('confirmarPassword').value;

                if (pass1 !== pass2) { mostrarMensaje('Las contraseñas no coinciden. Verifícalas.', 'error'); return; }
                if (pass1.length < 6) { mostrarMensaje('La contraseña debe tener al menos 6 caracteres.', 'error'); return; }

                const btn = document.getElementById('btnSubmit');
                btn.disabled = true;
                btn.textContent = 'Guardando...';

                try {
                    const resp = await fetch(`${window.SEMSAD_API}/restablecer_contrasena.php`, {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ correo, token, password: pass1 })
                    });

                    const texto = await resp.text();
                    let data;
                    try { data = JSON.parse(texto); }
                    catch (e) {
                        console.error('Respuesta no válida', resp.status, texto.slice(0, 300));
                        mostrarMensaje(`El servidor respondió algo inesperado (código ${resp.status}).`, 'error');
                        btn.disabled = false; btn.textContent = 'Guardar Nueva Contraseña';
                        return;
                    }

                    if (data.status === 'success') {
                        mostrarMensaje(data.mensaje, 'success');           // mensaje VERDE
                        form.style.display = 'none';
                        setTimeout(() => { window.location.href = 'index.html'; }, 3000);
                    } else {
                        mostrarMensaje(data.mensaje || 'No se pudo cambiar la contraseña.', 'error', data.codigo === 'enlace_invalido');  // mensaje ROJO
                        btn.disabled = false;
                        btn.textContent = 'Guardar Nueva Contraseña';
                    }
                } catch (err) {
                    console.error('Sin conexión con la API:', err);
                    mostrarMensaje('No se pudo conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Guardar Nueva Contraseña';
                }
            });
        });
    </script>
</body>
</html>
