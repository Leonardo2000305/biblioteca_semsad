<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante - Biblioteca SEMSAD</title>
    <!-- SIRVE PARA: mostrar e imprimir (o guardar como PDF) un comprobante de pago de multa o de préstamo. -->
    <!-- CONECTA CON: api/comprobantes_sirve_para_consultar.php. El estudiante ve solo los suyos; el personal, todos. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f1f5f9; color: #1e293b; }
        .comp-hoja { max-width: 640px; margin: 2rem auto; background: #fff; border-radius: 18px; box-shadow: 0 10px 30px rgba(15, 23, 42, .08); overflow: hidden; }
        .comp-cabecera { background: #0f172a; color: #fff; padding: 1.25rem 1.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .comp-marca { font-weight: 800; font-size: 1.1rem; }
        .comp-numero { background: rgba(255, 255, 255, .12); border-radius: 10px; padding: .4rem .8rem; font-weight: 700; letter-spacing: .03em; }
        .comp-cuerpo { padding: 1.5rem; }
        .comp-titulo { font-size: 1.35rem; font-weight: 800; text-align: center; margin-bottom: 1rem; }
        .comp-fila { display: flex; justify-content: space-between; gap: 1rem; padding: .6rem 0; border-bottom: 1px dashed #e2e8f0; }
        .comp-fila span:first-child { color: #64748b; }
        .comp-fila span:last-child { font-weight: 700; text-align: right; }
        .comp-total { font-size: 1.4rem; color: #dc2626; }
        .comp-ok { margin-top: 1.25rem; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: .9rem 1rem; color: #1e3a8a; }
        .comp-acciones { display: flex; gap: .5rem; justify-content: center; margin: 1rem 0 2rem; flex-wrap: wrap; }
        @media print {
            body { background: #fff; }
            .comp-acciones, #avisoEstadoDemo { display: none !important; }
            .comp-hoja { box-shadow: none; margin: 0; max-width: none; border-radius: 0; }
        }
    </style>
</head>
<body>
    <div class="comp-hoja" id="hoja">
        <div class="comp-cabecera">
            <div class="comp-marca"><i class="fa-solid fa-book-open me-2"></i>Biblioteca SEMSAD</div>
            <div class="comp-numero" id="compCodigo">—</div>
        </div>
        <div class="comp-cuerpo" id="compCuerpo">
            <p class="text-center text-muted mb-0">Cargando comprobante...</p>
        </div>
    </div>
    <!-- Nota de presentación fuera del comprobante oficial (no se imprime). -->
    <div id="avisoEstadoDemo" class="alert alert-info mx-auto mt-3 d-none" style="max-width:640px" role="status"></div>
    <div class="comp-acciones">
        <button class="btn btn-primary fw-bold px-4" onclick="window.print()"><i class="fa-solid fa-print me-1"></i>Imprimir / Guardar PDF</button>
        <button class="btn btn-outline-secondary fw-bold px-4" onclick="window.close()"><i class="fa-solid fa-xmark me-1"></i>Cerrar</button>
    </div>

    <script src="../js/config.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const tipo = params.get('tipo') || '';
        const id = params.get('id') || '';
        // Escapa texto para insertarlo en HTML.
        const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const bs = n => 'Bs. ' + Number(n || 0).toFixed(2).replace('.', ',');
        // Convierte "AAAA-MM-DD hh:mm:ss" en "DD/MM/AAAA hh:mm".
        const fecha = s => {
            if (!s) return '—';
            const [f, h] = String(s).split(' ');
            const [y, m, d] = f.split('-');
            return `${d}/${m}/${y}` + (h ? ' ' + h.slice(0, 5) : '');
        };
        const fila = (k, v) => `<div class="comp-fila"><span>${esc(k)}</span><span>${v}</span></div>`;

        function pintar(c) {
            document.getElementById('compCodigo').innerText = c.codigo;
            document.title = c.codigo + ' - Biblioteca SEMSAD';
            if (c.tipo === 'pago') {
                document.getElementById('compCuerpo').innerHTML = `
                    <div class="comp-titulo">Comprobante de Pago</div>
                    ${fila('Usuario', esc(c.usuario))}
                    ${fila('Concepto', esc(c.concepto))}
                    ${fila('Método de pago', esc(c.metodo))}
                    ${c.recibido !== null ? fila('Dinero recibido', bs(c.recibido)) + fila('Cambio entregado', bs(c.cambio)) : ''}
                    ${fila('Fecha y hora', fecha(c.fecha))}
                    ${fila('Responsable del cobro', esc(c.responsable))}
                    <div class="comp-fila"><span>Importe pagado</span><span class="comp-total">${bs(c.monto)}</span></div>
                    <div class="comp-ok"><i class="fa-solid fa-circle-check me-1"></i><b>Pago registrado correctamente.</b> Este comprobante es constancia de la operación realizada.</div>`;
            } else {
                document.getElementById('compCuerpo').innerHTML = `
                    <div class="comp-titulo">Comprobante de Préstamo</div>
                    ${fila('Usuario', esc(c.usuario))}
                    ${fila('Libro', esc(c.libro))}
                    ${fila('Fecha de entrega', fecha(c.fecha_entrega))}
                    ${fila('Fecha límite de devolución', fecha(c.fecha_limite))}
                    <div class="comp-ok"><i class="fa-solid fa-book me-1"></i>El libro salió de la biblioteca en la fecha indicada. Devuélvelo antes de la fecha límite.</div>`;
            }
        }

        function pintarRegistroPrueba(c) {
            document.getElementById('compCodigo').textContent = c.codigo || 'PRUEBA';
            document.title = String(c.codigo || 'Comprobante de prueba') + ' - Biblioteca SEMSAD';
            const detalles = Array.isArray(c.detalle) ? c.detalle : [];
            document.getElementById('compCuerpo').innerHTML =
                '<div class="comp-titulo">Constancia de operación de prueba</div>' +
                '<div class="alert alert-info"><strong>ENTORNO DE PRUEBAS.</strong> No hubo transferencia de dinero ni confirmación bancaria. Este documento no acredita un pago real.</div>' +
                fila('Usuario', esc(c.usuario || 'Estudiante')) +
                fila('Método de prueba', esc(c.metodo || 'Tarjeta')) +
                fila('Fecha y hora', esc(fecha(c.fecha))) +
                detalles.map(d => fila('Concepto', esc(d.titulo || 'Multa') + ' — ' + bs(d.monto))).join('') +
                '<div class="comp-fila"><span>Importe de prueba</span><span class="comp-total">' + bs(c.monto) + '</span></div>' +
                '<div class="comp-ok"><strong>Operación registrada en el entorno de pruebas.</strong> Disponible para consulta del administrador. No cambia las multas, la caja ni los préstamos reales.</div>';
        }
        async function cargar() {
            const cuerpo = document.getElementById('compCuerpo');
            if (!['pago', 'prestamo', 'demo'].includes(tipo) || !id) {
                cuerpo.innerHTML = '<p class="text-center text-danger mb-0">Comprobante no válido.</p>';
                return;
            }
            try {
                const url = tipo === 'demo'
                    ? window.SEMSAD_API + '/pagos_demo_sirve_para_registrar_y_listar.php?id=' + encodeURIComponent(id)
                    : window.SEMSAD_API + '/comprobantes_sirve_para_consultar.php?tipo=' +
                        encodeURIComponent(tipo) + '&id=' + encodeURIComponent(id);
                const resp = await fetch(url, { credentials: 'include', cache: 'no-store' });
                const res = await resp.json();
                if (res.status === 'success') {
                    if (tipo === 'demo') pintarRegistroPrueba(res.comprobante);
                    else pintar(res.comprobante);
                } else cuerpo.innerHTML = '<p class="text-center text-danger mb-0">' +
                    esc(res.mensaje || 'No se pudo cargar el comprobante.') + '</p>';
            } catch (e) {
                cuerpo.innerHTML = '<p class="text-center text-danger mb-0">Error de conexión al cargar el comprobante.</p>';
            }
        }
        // El comprobante de préstamo es histórico; el pago DEMO se muestra fuera, en una nota.
        async function actualizarAvisoDemo() {
            const aviso = document.getElementById('avisoEstadoDemo');
            aviso.classList.add('d-none');
            if (tipo !== 'prestamo') return;
            const usuario = SEMSAD.getUser();
            if (!usuario?.id) return;
            let arr = [];
            try {
                const data = JSON.parse(localStorage.getItem('semsad_pagos_prueba_v1') || '[]');
                if (Array.isArray(data)) arr = data;
            } catch (e) { return; }
            const cubiertos = new Set();
            arr.forEach(r => {
                if (r && r.estado === 'SIMULADO' && String(r.usuario_id || '') === String(usuario.id)
                    && Array.isArray(r.multa_ids)) r.multa_ids.forEach(n => cubiertos.add(Number(n)));
            });
            try {
                const dResp = await fetch(window.SEMSAD_API + '/pagos_demo_sirve_para_registrar_y_listar.php',
                    { credentials:'include', cache:'no-store' });
                const dRes = await dResp.json();
                if (dRes.status === 'success' && Array.isArray(dRes.lista)) {
                    dRes.lista.forEach(r => {
                        if (r && r.estado === 'SIMULADO'
                            && String(r.id_usuario || '') === String(usuario.id)
                            && Array.isArray(r.multa_ids)) {
                            r.multa_ids.forEach(n => cubiertos.add(Number(n)));
                        }
                    });
                }
            } catch (e) { /* Se conserva el estado local si el servidor de pruebas no responde. */ }
            if (!cubiertos.size) return;
            try {
                const res = await fetch(window.SEMSAD_API + '/mis_prestamos_sirve_para_historial_del_estudiante.php',
                    { credentials: 'include', cache: 'no-store' });
                const data = await res.json();
                if (data.status !== 'success' || !Array.isArray(data.prestamos)) return;
                const p = data.prestamos.find(x => Number(x.id_prestamo) === Number(id));
                const pendientes = Array.isArray(p?.multas_pendientes_ids)
                    ? p.multas_pendientes_ids.map(Number) : [];
                const n = pendientes.filter(n => cubiertos.has(n)).length;
                if (!n) return;
                aviso.textContent = n === pendientes.length
                    ? 'MULTA CUBIERTA EN DEMO: este pago fue simulado. El préstamo conserva su estado real y, si está vencido, sigue así hasta devolver el libro. La deuda real no cambió.'
                    : 'DEMO: se simuló parte de la multa de este préstamo; las deudas y los estados reales no se han modificado.';
                aviso.classList.remove('d-none');
            } catch (e) { /* El comprobante oficial se muestra incluso sin este estado opcional. */ }
        }
        cargar();
        actualizarAvisoDemo();
        window.addEventListener('storage', e => {
            if (e.key === 'semsad_pagos_prueba_v1') actualizarAvisoDemo();
        });
    </script>
</body>
</html>
