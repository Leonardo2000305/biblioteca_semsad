<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Estudiantes - Biblioteca SEMSAD</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-light: #f8fafc;
        }
        body {
            background-color: var(--bg-light);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        .navbar-custom {
            background-color: #0f172a;
        }
        .hero-section {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            padding: 40px 20px;
            border-radius: 16px;
            margin-bottom: 30px;
        }
        .book-card {
            border: none;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }
        .extra-small {
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- NAVBAR PRINCIPAL -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-book-open text-primary"></i>
                <span>BIBLIOTECA SEMSAD</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-secondary px-3 py-2 fs-6">
                    <i class="fa-solid fa-user-graduate me-1"></i>Estudiante
                </span>
                <a href="../login/index.html" onclick="SEMSAD.cerrarSesion(event)" class="btn btn-outline-light btn-sm fw-bold">
                    <i class="fa-solid fa-right-from-bracket me-1"></i>Salir
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container my-4">
        <!-- HERO / BUSCADOR -->
        <div class="hero-section text-center shadow">
            <h2 class="fw-bold mb-2">Bienvenido al Catálogo Digital</h2>
            <p class="text-light opacity-75 mb-4">Busca libros disponibles en la biblioteca institucional</p>
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-white border-0 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="inputBuscar" class="form-control border-0 px-3" placeholder="Buscar por título, autor o código..." onkeyup="filtrarLibros()">
                    </div>
                </div>
            </div>
        </div>

        <!-- CATÁLOGO DE LIBROS -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold text-dark mb-0"><i class="fa-solid fa-books text-primary me-2"></i>Libros Disponibles</h4>
            <button class="btn btn-sm btn-outline-primary fw-semibold" onclick="cargarCatalogo()">
                <i class="fa-solid fa-rotate me-1"></i>Actualizar
            </button>
        </div>

        <div class="row g-4" id="contenedorLibros">
            <!-- Se cargan dinámicamente -->
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script>SEMSAD.exigirSesion(false);</script>
    <script>
        let todosLosLibros = [];

        document.addEventListener('DOMContentLoaded', () => {
            cargarCatalogo();
        });

        // Función para desempaquetar y extraer credenciales de usuario sin importar la anidación
        function extraerDatosUsuario(obj) {
            if (!obj) return null;
            if (typeof obj === 'string') {
                try { obj = JSON.parse(obj); } catch(e) { return null; }
            }
            if (typeof obj !== 'object' || obj === null) return null;

            if (obj.usuario && typeof obj.usuario === 'object') {
                const res = extraerDatosUsuario(obj.usuario);
                if (res) return res;
            }
            if (obj.user && typeof obj.user === 'object') {
                const res = extraerDatosUsuario(obj.user);
                if (res) return res;
            }
            if (obj.datos && typeof obj.datos === 'object') {
                const res = extraerDatosUsuario(obj.datos);
                if (res) return res;
            }
            if (obj.data && typeof obj.data === 'object') {
                const res = extraerDatosUsuario(obj.data);
                if (res) return res;
            }

            const id = obj.id_usuario || obj.id || obj.usuario_id || obj.user_id || obj.userId || 0;
            const correo = obj.correo || obj.email || obj.userCorreo || obj.correo_electronico || '';

            if (id || correo) {
                return {
                    id_usuario: parseInt(id) || 0,
                    correo: String(correo).trim(),
                    nombres: obj.nombres || obj.nombre || '',
                    apellidos: obj.apellidos || ''
                };
            }
            return null;
        }

        function obtenerUsuarioLogueado() {
            let u = null;

            // 1. Probar objeto SEMSAD global
            if (typeof SEMSAD !== 'undefined') {
                if (typeof SEMSAD.obtenerUsuario === 'function') u = extraerDatosUsuario(SEMSAD.obtenerUsuario());
                if (!u && typeof SEMSAD.getUser === 'function') u = extraerDatosUsuario(SEMSAD.getUser());
                if (!u && SEMSAD.usuario) u = extraerDatosUsuario(SEMSAD.usuario);
                if (!u && SEMSAD.user) u = extraerDatosUsuario(SEMSAD.user);
                if (!u && SEMSAD.sesion) u = extraerDatosUsuario(SEMSAD.sesion);
            }
            if (u) return u;

            // 2. Probar claves conocidas en localStorage y sessionStorage
            const clavesPrioritarias = [
                'semsad_usuario', 'semsad_sesion', 'semsad_user', 'usuario', 'sesion', 'user', 
                'semsad_login', 'login_data', 'user_data', 'userData', 'user_session'
            ];
            
            for (let k of clavesPrioritarias) {
                const itemLocal = localStorage.getItem(k);
                if (itemLocal) {
                    u = extraerDatosUsuario(itemLocal);
                    if (u) return u;
                }
                const itemSession = sessionStorage.getItem(k);
                if (itemSession) {
                    u = extraerDatosUsuario(itemSession);
                    if (u) return u;
                }
            }

            // 3. Recorrer exhaustivamente todo el almacenamiento local
            const storages = [localStorage, sessionStorage];
            for (let store of storages) {
                for (let i = 0; i < store.length; i++) {
                    const key = store.key(i);
                    if (key) {
                        const item = store.getItem(key);
                        u = extraerDatosUsuario(item);
                        if (u) return u;
                    }
                }
            }

            return null;
        }

        async function cargarCatalogo() {
            const contenedor = document.getElementById('contenedorLibros');
            contenedor.innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="fa-solid fa-spinner fa-spin fa-2xl text-primary mb-3"></i>
                    <p class="text-muted fw-semibold">Cargando catálogo de libros...</p>
                </div>`;

            try {
                const resp = await fetch(window.SEMSAD_API + '/obtener_libros.php', { credentials: 'include' });
                const res = await resp.json();

                const listaLibros = res.libros || res.data || res.datos || [];

                if (res.status === 'success' && listaLibros.length > 0) {
                    todosLosLibros = listaLibros;
                    renderizarLibros(todosLosLibros);
                } else {
                    contenedor.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fa-solid fa-book-bookmark fa-3x text-muted mb-3"></i>
                            <p class="text-muted fs-5">No hay libros disponibles en este momento.</p>
                        </div>`;
                }
            } catch (e) {
                console.error("Error en cargarCatalogo:", e);
                contenedor.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fa-solid fa-circle-exclamation fa-3x text-danger mb-3"></i>
                        <p class="text-danger fs-5">Error al conectar con el servidor para obtener los libros.</p>
                    </div>`;
            }
        }

        function renderizarLibros(lista) {
            const contenedor = document.getElementById('contenedorLibros');
            if (!lista || lista.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-12 text-center py-4">
                        <p class="text-muted fs-5">No se encontraron libros que coincidan con la búsqueda.</p>
                    </div>`;
                return;
            }

            contenedor.innerHTML = '';
            lista.forEach(libro => {
                const idMaterial = libro.id_material || libro.id;
                const titulo = libro.titulo || libro.nombre || 'Sin título';
                const isbn = libro.isbn || libro.codigo_isbn_issn || libro.codigo_barras || 'Código S/N';
                const anio = libro.agno_publicacion || libro.año_publicacion || libro.anio || libro.year || 'N/A';
                const autor = libro.autores || libro.autor || 'Autor no especificado';
                
                const stockDisponible = (libro.stock_disponible !== undefined) ? parseInt(libro.stock_disponible) : parseInt(libro.disponible || 0);
                const reservadoPorMi = libro.reservado_por_mi === true;
                const estaDisponible = stockDisponible > 0 && !reservadoPorMi;

                let badgeHTML = '';
                let botonHTML = '';

                if (reservadoPorMi) {
                    badgeHTML = `<span class="badge bg-warning text-dark mb-2"><i class="fa-solid fa-bookmark me-1"></i>Ya reservaste este libro</span>`;
                    botonHTML = `<button class="btn btn-warning text-dark w-100 fw-bold btn-sm mt-2" disabled>
                                    <i class="fa-solid fa-check-double me-1"></i> Libro en tu Poder
                                 </button>`;
                } else if (estaDisponible) {
                    badgeHTML = `<span class="badge bg-success mb-2"><i class="fa-solid fa-circle-check me-1"></i>Disponible</span>`;
                    botonHTML = `<button class="btn btn-outline-primary w-100 fw-bold btn-sm mt-2" onclick="solicitarPrestamo(${idMaterial}, '${SEMSAD.esc(titulo)}')">
                                    <i class="fa-solid fa-hand-holding-hand me-1"></i> Solicitar Préstamo
                                 </button>`;
                } else {
                    badgeHTML = `<span class="badge bg-danger mb-2"><i class="fa-solid fa-circle-xmark me-1"></i>Agotado</span>`;
                    botonHTML = `<button class="btn btn-secondary w-100 fw-bold btn-sm mt-2" disabled>
                                    <i class="fa-solid fa-ban me-1"></i> No Disponible
                                 </button>`;
                }

                contenedor.innerHTML += `
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="card book-card h-100 shadow-sm p-3 bg-white">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <div>
                                    ${badgeHTML}
                                    <h5 class="fw-bold text-dark mb-1">${SEMSAD.esc(titulo)}</h5>
                                    <p class="text-muted small mb-2"><i class="fa-solid fa-user-pen me-1"></i>${SEMSAD.esc(autor)}</p>
                                    <p class="text-secondary extra-small mb-3"><i class="fa-solid fa-barcode me-1"></i>ISBN: ${SEMSAD.esc(isbn)} | Año: ${SEMSAD.esc(anio)}</p>
                                </div>
                                ${botonHTML}
                            </div>
                        </div>
                    </div>`;
            });
        }

        async function solicitarPrestamo(idMaterial, tituloLibro) {
            const userObj = obtenerUsuarioLogueado();

            if (!userObj || (!userObj.id_usuario && !userObj.correo)) {
                alert("No se detectó una sesión activa de estudiante. Por favor, inicia sesión nuevamente.");
                window.location.href = '../login/index.html';
                return;
            }

            const idUsuario = userObj.id_usuario || 0;
            const correoUsuario = userObj.correo || '';

            if (!confirm(`¿Confirmas que deseas solicitar el préstamo de "${tituloLibro}" por 7 días?`)) {
                return;
            }

            try {
                const resp = await fetch(window.SEMSAD_API + '/registrar_prestamo.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        id_material: idMaterial,
                        id_usuario: idUsuario,
                        correo: correoUsuario,
                        dias_prestamo: 7
                    })
                });

                const res = await resp.json();

                if (res.status === 'success') {
                    if (typeof SEMSAD !== 'undefined' && SEMSAD.toast) {
                        SEMSAD.toast(res.mensaje, 'success');
                    } else {
                        alert(res.mensaje);
                    }
                    cargarCatalogo();
                } else {
                    if (typeof SEMSAD !== 'undefined' && SEMSAD.toast) {
                        SEMSAD.toast(res.mensaje || 'Error al procesar el préstamo.', 'error');
                    } else {
                        alert(res.mensaje || 'Error al procesar el préstamo.');
                    }
                }
            } catch (e) {
                console.error("Error al solicitar préstamo:", e);
                alert("Error de conexión al procesar la solicitud de préstamo.");
            }
        }

        function filtrarLibros() {
            const texto = document.getElementById('inputBuscar').value.toLowerCase().trim();
            if (!texto) {
                renderizarLibros(todosLosLibros);
                return;
            }
            const filtrados = todosLosLibros.filter(libro => {
                const titulo = (libro.titulo || libro.nombre || '').toLowerCase();
                const autor = (libro.autores || libro.autor || '').toLowerCase();
                const isbn = (libro.isbn || libro.codigo_isbn_issn || libro.codigo_barras || '').toLowerCase();
                return titulo.includes(texto) || autor.includes(texto) || isbn.includes(texto);
            });
            renderizarLibros(filtrados);
        }
    </script>
</body>
</html>
