<!DOCTYPE html>
<!-- ARCHIVO: index.html -->
<!-- CAPA: FRONTEND (lo que ve y usa la persona en el navegador) -->
<!-- SIRVE PARA: portal de estudiantes y docentes: ver el catálogo, buscar libros, pedir préstamos, anotarse en la lista de espera y revisar el historial. -->
<!-- QUÉ HACE: muestra una tarjeta por libro con su disponibilidad; permite buscar por texto o por categoría. -->
<!--   Botones: Solicitar Préstamo, lista de espera, Renovar; el modal Mis Préstamos muestra el historial. Cada acción llama a la API y muestra un aviso. -->
<!-- CONECTA CON: js/config.js y la API en /backend/: obtener_libros_sirve_para_mostrar_catalogo.php, registrar_prestamo_sirve_para_pedir_libro_estudiante.php, -->
<!--   reservar_material_sirve_para_lista_de_espera.php, renovar_prestamo_sirve_para_ampliar_7_dias.php y mis_prestamos_sirve_para_historial_del_estudiante.php. -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Estudiantes - Biblioteca SEMSAD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos propios de esta página. Bootstrap y Font Awesome vienen de internet (líneas 7 y 8). -->
    <style>
        /* Colores generales: fondo claro y color principal. */
        :root { --primary-color: #2563eb; --bg-light: #f8fafc; }
        body { background-color: var(--bg-light); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 100vh; }
        .navbar-custom { background-color: #0f172a; }
        /* Franja de bienvenida con el buscador: fondo oscuro y esquinas redondeadas. */
        .hero-section { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; padding: 40px 20px; border-radius: 16px; margin-bottom: 30px; }
        /* Tarjeta de libro: esquinas redondeadas y se eleva un poco al pasar el mouse. */
        .book-card { border: none; border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .extra-small { font-size: 12px; }
        /* Celulares y tabletas: la barra superior se ajusta al ancho de la pantalla (los botones bajan de línea, nada se sale) */
        @media (max-width: 991.98px) {
            .navbar-custom > .container { flex-wrap: wrap; row-gap: .5rem; column-gap: .5rem; min-width: 0; }
            .navbar-custom .navbar-brand { min-width: 0; max-width: 100%; white-space: normal; }
            .nav-acciones { flex-wrap: wrap; justify-content: flex-end; min-width: 0; max-width: 100%; row-gap: .4rem; }
            #badgeUsuario { white-space: normal; overflow-wrap: anywhere; text-align: left; max-width: 100%; }
            .cabecera-catalogo { flex-wrap: wrap; gap: .5rem; min-width: 0; }
        }
        /* Celulares pequeños (hasta 575 px): marca y título un poco más compactos */
        @media (max-width: 575.98px) {
            .navbar-custom .navbar-brand { font-size: 1.05rem; }
            /* Historial de préstamos en celular: cada préstamo es una tarjeta (sin columnas cortadas ni scroll lateral) */
            .modal-dialog { margin: .5rem; }
            .tabla-prestamos thead { display: none; }
            .tabla-prestamos, .tabla-prestamos tbody, .tabla-prestamos tr, .tabla-prestamos td { display: block; width: 100%; }
            .tabla-prestamos tr { padding: 12px 16px; border-bottom: 1px solid #e5e7eb; }
            .tabla-prestamos tr:last-child { border-bottom: 0; }
            .tabla-prestamos > tbody > tr:hover > * { --bs-table-accent-bg: transparent; }
            .tabla-prestamos td { border: 0; padding: 3px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: right; overflow-wrap: anywhere; }
            .tabla-prestamos td::before { content: attr(data-label); color: #6b7280; font-size: .8rem; font-weight: 600; text-align: left; }
            .tabla-prestamos td.celda-titulo { display: block; text-align: left; font-size: 1rem; padding-bottom: 6px; }
            .tabla-prestamos td.celda-titulo::before { content: none; }
            .tabla-prestamos td.celda-accion { display: block; text-align: left; padding-top: 8px; }
            .tabla-prestamos td.celda-accion:empty { display: none; }
            .tabla-prestamos td.celda-accion .btn { width: 100%; }
            .tabla-prestamos td[colspan] { display: block; text-align: center; justify-content: center; }
            .tabla-prestamos td[colspan]::before { content: none; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR PRINCIPAL -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-book-open text-primary"></i>
                <span>BIBLIOTECA SEMSAD</span>
            </a>
            <div class="d-flex align-items-center gap-2 nav-acciones">
                <!-- Botón Mis Préstamos: abre el modal del historial y carga los datos con cargarMisPrestamos(). -->
                <button class="btn btn-outline-info btn-sm fw-bold me-2" data-bs-toggle="modal" data-bs-target="#modalMisPrestamos" onclick="cargarMisPrestamos()">
                    <i class="fa-solid fa-clock-rotate-left me-1"></i>Mis Préstamos
                </button>
                <!-- Muestra el nombre de quien inició sesión; el texto lo pone JavaScript al cargar la página. -->
                <span class="badge bg-primary px-3 py-2 fs-6 shadow-sm" id="badgeUsuario">
                    <i class="fa-solid fa-user-graduate me-1"></i><span id="nombreUsuarioHeader">Estudiante</span>
                </span>
                <!-- Salir: SEMSAD.cerrarSesion (js/config.js) borra el usuario y lleva al login. -->
                <a href="../login/index.html" onclick="SEMSAD.cerrarSesion(event)" class="btn btn-outline-light btn-sm fw-bold">
                    <i class="fa-solid fa-right-from-bracket me-1"></i>Salir
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container my-4">
        <!-- HERO / BUSCADOR -->
        <div class="hero-section text-center shadow">
            <h2 class="fw-bold mb-2">Bienvenido al Catálogo Digital</h2>
            <p class="text-light opacity-75 mb-4">Busca libros disponibles en la biblioteca institucional</p>
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-white border-0 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <!-- Buscador: cada tecla llama a filtrarLibros(), que filtra la lista sin recargar la página. -->
                        <input type="text" id="inputBuscar" class="form-control border-0 px-3" placeholder="Buscar por título, autor o código..." onkeyup="filtrarLibros()">
                    </div>
                    <!-- Selector de categorías: JavaScript lo llena con las categorías de los libros (poblarCategorias). Empieza oculto. -->
                    <select id="selCategoria" class="form-select border-0 mt-2 d-none" onchange="filtrarLibros()" aria-label="Filtrar por categoría">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- CATÁLOGO DE LIBROS -->
        <div class="d-flex justify-content-between align-items-center mb-3 cabecera-catalogo">
            <h4 class="fw-bold text-dark mb-0"><i class="fa-solid fa-books text-primary me-2"></i>Libros Disponibles</h4>
            <!-- Actualizar: vuelve a pedir el catálogo a la API. -->
            <button class="btn btn-sm btn-outline-primary fw-semibold" onclick="cargarCatalogo()">
                <i class="fa-solid fa-rotate me-1"></i>Actualizar
            </button>
        </div>

        <!-- Aquí JavaScript dibuja una tarjeta por cada libro (renderizarLibros). -->
        <div class="row g-4" id="contenedorLibros"></div>
    </div>

    <!-- MODAL MIS PRÉSTAMOS -->
    <div class="modal fade" id="modalMisPrestamos" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-bookmark text-primary me-2"></i>Mi Historial de Préstamos</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="table-responsive">
                        <!-- Tabla del historial. En celulares cada fila se muestra como tarjeta gracias a la clase tabla-prestamos del CSS. -->
                        <table class="table table-hover align-middle mb-0 tabla-prestamos">
                            <thead class="table-light">
                                <tr>
                                    <th>Libro</th>
                                    <th>Fecha Solicitud</th>
                                    <th>Fecha Límite</th>
                                    <th>Estado</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <!-- Filas del historial: las escribe cargarMisPrestamos(). -->
                            <tbody id="tablaMisPrestamosBody">
                                <tr><td colspan="5" class="text-center py-4">Cargando tus préstamos...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script>
        // Lista con todos los libros que llegaron de la API. Los filtros trabajan sobre esta copia.
        let todosLosLibros = [];

        // Al cargar la página: muestra el nombre del usuario y carga el catálogo.
        document.addEventListener('DOMContentLoaded', () => {
            // Obtiene el usuario que inició sesión.
            const user = obtenerUsuarioLogueado();
            // Si hay usuario, muestra su nombre completo (o su correo); si no, muestra Estudiante.
            if (user) {
                document.getElementById('nombreUsuarioHeader').innerText = user.nombreCompleto || user.correo;
            } else {
                document.getElementById('nombreUsuarioHeader').innerText = "Estudiante";
            }
            cargarCatalogo();
        });

        // Devuelve el usuario que inició sesión con id_usuario, correo y nombreCompleto; o null si no hay sesión.
        function obtenerUsuarioLogueado() {
            // Única fuente: el usuario que guardó el inicio de sesión actual (semsad_user).
            // Antes se recorría todo el navegador y podía tomar datos viejos de otra cuenta.
            const u = (typeof SEMSAD !== 'undefined' && SEMSAD.getUser) ? SEMSAD.getUser() : null;
            if (u && (u.id || u.correo)) {
                return {
                    id_usuario: parseInt(u.id) || 0,
                    correo: String(u.correo || '').trim(),
                    nombres: '',
                    apellidos: '',
                    nombreCompleto: String(u.name || u.correo || '').trim()
                };
            }
            return null;
            // AVISO: esta función nunca se llama: todas sus llamadas están después del return null de arriba (código sin uso).
            //   Revisar si se puede eliminar.
            function extraerUser(candidate) {
                if (!candidate) return null;
                if (typeof candidate === 'string') {
                    try { candidate = JSON.parse(candidate); } catch(e) { return null; }
                }
                if (typeof candidate !== 'object' || candidate === null) return null;

                let obj = candidate.usuario || candidate.user || candidate.datos || candidate.data || candidate;
                if (obj.usuario) obj = obj.usuario;
                if (obj.user) obj = obj.user;

                const id = obj.id_usuario || obj.id || obj.usuario_id || obj.user_id || 0;
                const correo = obj.correo || obj.email || obj.userCorreo || obj.correo_electronico || '';
                const nombres = obj.nombres || obj.nombre || '';
                const apellidos = obj.apellidos || obj.apellido || '';

                if (parseInt(id) > 0 || (typeof correo === 'string' && correo.trim().includes('@'))) {
                    return {
                        id_usuario: parseInt(id) || 0,
                        correo: String(correo).trim(),
                        nombres: String(nombres).trim(),
                        apellidos: String(apellidos).trim(),
                        nombreCompleto: (String(nombres) + ' ' + String(apellidos)).trim() || String(correo).trim()
                    };
                }
                return null;
            }

            if (typeof SEMSAD !== 'undefined') {
                if (typeof SEMSAD.obtenerUsuario === 'function') {
                    const res = extraerUser(SEMSAD.obtenerUsuario());
                    if (res) return res;
                }
                if (typeof SEMSAD.obtenerSesion === 'function') {
                    const res = extraerUser(SEMSAD.obtenerSesion());
                    if (res) return res;
                }
            }

            const storages = [localStorage, sessionStorage];
            const keys = ['semsad_sesion', 'semsad_usuario', 'usuario', 'sesion', 'semsad_user', 'user', 'userData', 'datos'];
            
            for (let store of storages) {
                for (let k of keys) {
                    try {
                        const item = store.getItem(k);
                        const res = extraerUser(item);
                        if (res) return res;
                    } catch(e) {}
                }
            }

            for (let store of storages) {
                for (let i = 0; i < store.length; i++) {
                    try {
                        const key = store.key(i);
                        const item = store.getItem(key);
                        const res = extraerUser(item);
                        if (res) return res;
                    } catch(e) {}
                }
            }

            return null;
        }

        // Pide el catálogo a la API y dibuja las tarjetas. Muestra mensajes de cargando, vacío o error.
        async function cargarCatalogo() {
            const userObj = obtenerUsuarioLogueado();
            const idUsuario = userObj ? userObj.id_usuario : 0;
            const correoUsuario = userObj ? userObj.correo : '';

            const contenedor = document.getElementById('contenedorLibros');
            contenedor.innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="fa-solid fa-spinner fa-spin fa-2xl text-primary mb-3"></i>
                    <p class="text-muted fw-semibold">Cargando catálogo de libros...</p>
                </div>`;

            try {
                // Llamada GET: envía el id y el correo del usuario en la URL, para que la API marque sus reservas.
                const url = window.SEMSAD_API + '/obtener_libros_sirve_para_mostrar_catalogo.php?id_usuario=' + idUsuario + '&correo=' + encodeURIComponent(correoUsuario);
                const resp = await fetch(url, { credentials: 'include' });
                const res = await resp.json();

                // La API puede devolver la lista con distintos nombres (libros, data o datos); se acepta cualquiera.
                const listaLibros = res.libros || res.data || res.datos || [];

                // Si hay libros, los guarda, arma el selector de categorías y dibuja las tarjetas.
                if (res.status === 'success' && listaLibros.length > 0) {
                    todosLosLibros = listaLibros;
                    poblarCategorias();
                    renderizarLibros(todosLosLibros);
                } else {
                    contenedor.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fa-solid fa-book-bookmark fa-3x text-muted mb-3"></i>
                            <p class="text-muted fs-5">No hay libros disponibles en este momento.</p>
                        </div>`;
                }
            } catch (e) {
                console.error("Error en cargarCatalogo:", e);
                contenedor.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fa-solid fa-circle-exclamation fa-3x text-danger mb-3"></i>
                        <p class="text-danger fs-5">Error al conectar con el servidor para obtener los libros.</p>
                    </div>`;
            }
        }

        // Dibuja una tarjeta por libro. Según su situación muestra: Ya reservaste, Disponible o Agotado.
        function renderizarLibros(lista) {
            const contenedor = document.getElementById('contenedorLibros');
            if (!lista || lista.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-12 text-center py-4">
                        <p class="text-muted fs-5">No se encontraron libros que coincidan con la búsqueda.</p>
                    </div>`;
                return;
            }

            contenedor.innerHTML = '';
            lista.forEach(libro => {
                // Toma los datos del libro aceptando los distintos nombres de campo que puede enviar la API.
                const idMaterial = parseInt(libro.id_material || libro.id) || 0;
                const titulo = libro.titulo || libro.nombre || 'Sin título';
                const isbn = libro.isbn || libro.codigo_isbn_issn || libro.codigo_barras || 'Código S/N';
                const anio = libro.agno_publicacion || libro.año_publicacion || libro.anio || libro.year || 'N/A';
                const autor = libro.autores || libro.autor || 'Autor no especificado';
                
                // Copias disponibles: usa stock_disponible o, si no existe, el campo disponible.
                const stockDisponible = (libro.stock_disponible !== undefined) ? parseInt(libro.stock_disponible) : parseInt(libro.disponible || 0);
                // Verdadero si este usuario ya tiene reservado o en su poder este libro.
                const reservadoPorMi = libro.reservado_por_mi === true;
                // Está disponible si tiene copias y el usuario no lo tiene ya.
                const estaDisponible = stockDisponible > 0 && !reservadoPorMi;

                let badgeHTML = '';
                let botonHTML = '';

                // Caso 1: el usuario ya tiene el libro. El botón queda deshabilitado.
                if (reservadoPorMi) {
                    badgeHTML = `<span class="badge bg-warning text-dark mb-2"><i class="fa-solid fa-bookmark me-1"></i>Ya reservaste este libro</span>`;
                    botonHTML = `<button class="btn btn-warning text-dark w-100 fw-bold btn-sm mt-2" disabled>
                                    <i class="fa-solid fa-check-double me-1"></i> Libro en tu Poder
                                 </button>`;
                // Caso 2: disponible. El botón Solicitar Préstamo llama a solicitarPrestamo().
                } else if (estaDisponible) {
                    badgeHTML = `<span class="badge bg-success mb-2"><i class="fa-solid fa-circle-check me-1"></i>Disponible</span>`;
                    botonHTML = `<button class="btn btn-outline-primary w-100 fw-bold btn-sm mt-2" onclick="solicitarPrestamo(${idMaterial}, ${SEMSAD.jsArg(titulo)})">
                                    <i class="fa-solid fa-hand-holding-hand me-1"></i> Solicitar Préstamo
                                 </button>`;
                } else {
                    // Caso 3: agotado. El botón queda deshabilitado, y debajo se ofrece la lista de espera.
                    badgeHTML = `<span class="badge bg-danger mb-2"><i class="fa-solid fa-circle-xmark me-1"></i>Agotado</span>`;
                    botonHTML = `<button class="btn btn-secondary w-100 fw-bold btn-sm mt-2" disabled>
                                    <i class="fa-solid fa-ban me-1"></i> No Disponible
                                 </button>`;
                    // Lista de espera: si el usuario ya está en ella, le ofrece salir; si no, le ofrece anotarse.
                    const enCola = parseInt(libro.en_cola || 0);
                    if (parseInt(libro.mi_turno || 0) > 0) {
                        botonHTML += `<div class="small text-center text-warning-emphasis fw-semibold mt-2"><i class="fa-solid fa-hourglass-half me-1"></i>En lista de espera · tu turno: ${parseInt(libro.mi_turno)}</div>
                                      <button class="btn btn-outline-secondary w-100 btn-sm mt-1" onclick="reservarMaterial(${idMaterial}, ${SEMSAD.jsArg(titulo)}, 'cancelar')">Salir de la lista de espera</button>`;
                    } else {
                        botonHTML += `<button class="btn btn-outline-warning w-100 fw-bold btn-sm mt-2" onclick="reservarMaterial(${idMaterial}, ${SEMSAD.jsArg(titulo)})">
                                        <i class="fa-solid fa-hourglass-half me-1"></i> Anotarme en lista de espera${enCola > 0 ? ' (' + enCola + ' esperando)' : ''}
                                      </button>`;
                    }
                }

                // Etiqueta con la categoría del libro (solo si tiene una).
                const catHTML = libro.categoria ? `<span class="badge bg-light text-secondary border ms-1 mb-2">${SEMSAD.esc(libro.categoria)}</span>` : '';

                // Agrega la tarjeta al final del contenedor.
                contenedor.innerHTML += `
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="card book-card h-100 shadow-sm p-3 bg-white">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <div>
                                    ${badgeHTML}${catHTML}
                                    <h5 class="fw-bold text-dark mb-1">${SEMSAD.esc(titulo)}</h5>
                                    <p class="text-muted small mb-2"><i class="fa-solid fa-user-pen me-1"></i>${SEMSAD.esc(autor)}</p>
                                    <p class="text-secondary extra-small mb-3"><i class="fa-solid fa-barcode me-1"></i>ISBN: ${SEMSAD.esc(isbn)} | Año: ${SEMSAD.esc(anio)}</p>
                                </div>
                                ${botonHTML}
                            </div>
                        </div>
                    </div>`;
            });
        }

        // Pide un préstamo de 7 días: primero verifica la sesión, luego pide confirmación y envía la solicitud.
        async function solicitarPrestamo(idMaterial, tituloLibro) {
            const userObj = obtenerUsuarioLogueado();

            // Si no hay usuario identificado, avisa y manda al login.
            if (!userObj || (!userObj.id_usuario && !userObj.correo)) {
                alert("No se detectó tu sesión activa de estudiante. Redirigiendo al inicio de sesión...");
                window.location.href = '../login/index.html';
                return;
            }

            const nombreSolicitante = userObj.nombreCompleto || userObj.correo;
            // Pide confirmación antes de enviar la solicitud.
            if (!confirm(`¿Confirmas que deseas solicitar el préstamo de "${tituloLibro}" a nombre de ${nombreSolicitante} por 7 días?`)) {
                return;
            }

            try {
                // Llamada POST a la API de préstamos con el id del libro, el usuario y 7 días.
                const resp = await fetch(window.SEMSAD_API + '/registrar_prestamo_sirve_para_pedir_libro_estudiante.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        id_material: idMaterial,
                        id_usuario: userObj.id_usuario,
                        correo: userObj.correo,
                        dias_prestamo: 7
                    })
                });

                const res = await resp.json();

                // Éxito: muestra el aviso y vuelve a cargar el catálogo para actualizar el stock.
                if (res.status === 'success') {
                    if (typeof SEMSAD !== 'undefined' && SEMSAD.toast) {
                        SEMSAD.toast(res.mensaje, 'success');
                    } else {
                        alert(res.mensaje);
                    }
                    cargarCatalogo();
                } else {
                    // Si la sesión expiró: muestra el aviso y, a los 2,5 segundos, regresa al login.
                    if (res.codigo === 'sin_sesion') {
                        SEMSAD.toast(res.mensaje, 'error');
                        setTimeout(() => { window.location.href = '../login/index.html'; }, 2500);
                        return;
                    }
                    if (typeof SEMSAD !== 'undefined' && SEMSAD.toast) {
                        SEMSAD.toast(res.mensaje || 'Error al procesar el préstamo.', 'error');
                    } else {
                        alert(res.mensaje || 'Error al procesar el préstamo.');
                    }
                }
            } catch (e) {
                console.error("Error al solicitar préstamo:", e);
                alert("Error de conexión al procesar la solicitud de préstamo.");
            }
        }

        // Carga el historial de préstamos del usuario en la tabla del modal.
        async function cargarMisPrestamos() {
            const userObj = obtenerUsuarioLogueado();
            const tbody = document.getElementById('tablaMisPrestamosBody');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4"><i class="fa-solid fa-spinner fa-spin me-2 text-primary"></i>Cargando tus préstamos...</td></tr>';

            if (!userObj) return;

            try {
                const url = window.SEMSAD_API + '/mis_prestamos_sirve_para_historial_del_estudiante.php?id_usuario=' + userObj.id_usuario + '&correo=' + encodeURIComponent(userObj.correo);
                const resp = await fetch(url, { credentials: 'include' });
                const res = await resp.json();

                // Si hay préstamos, arma una fila por cada uno. Si no hay, muestra un mensaje.
                if (res.status === 'success' && res.prestamos.length > 0) {
                    tbody.innerHTML = '';
                    res.prestamos.forEach(p => {
                        // Etiqueta del estado: Activo (azul), Devuelto (verde) o Vencido (rojo).
                        let badge = '<span class="badge bg-primary">Activo</span>';
                        if (p.estado === 'Devuelto') badge = '<span class="badge bg-success">Devuelto</span>';
                        if (p.estado === 'Vencido' || p.estado === 'Con Mora') badge = '<span class="badge bg-danger">Vencido (Con Mora)</span>';

                        // Agrega la fila. El botón Renovar solo aparece en los préstamos Activos.
                        tbody.innerHTML += `
                            <tr>
                                <td class="fw-bold text-dark celda-titulo">${SEMSAD.esc(p.titulo)}</td>
                                <td class="text-muted small" data-label="Fecha solicitud">${SEMSAD.esc(p.fecha_salida)}</td>
                                <td class="fw-bold text-primary" data-label="Fecha límite">${SEMSAD.esc(p.fecha_limite)}</td>
                                <td data-label="Estado">${badge}</td>
                                <td class="celda-accion">${p.estado === 'Activo' ? `<button class="btn btn-outline-primary btn-sm fw-bold" onclick="renovarPrestamo(${parseInt(p.id_prestamo)})"><i class="fa-solid fa-rotate me-1"></i>Renovar</button>` : ''}</td>
                            </tr>`;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No tienes registros de préstamos aún.</td></tr>';
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-danger">Error al consultar tus préstamos.</td></tr>';
            }
        }

        // Llena el selector de categorías con los nombres únicos, en orden alfabético.
        function poblarCategorias() {
            const sel = document.getElementById('selCategoria');
            const nombres = [...new Set(todosLosLibros.map(l => l.categoria).filter(Boolean))].sort();
            const actual = sel.value;
            sel.innerHTML = '<option value="">Todas las categorías</option>' + nombres.map(n => `<option value="${SEMSAD.esc(n)}">${SEMSAD.esc(n)}</option>`).join('');
            sel.value = nombres.includes(actual) ? actual : '';
            sel.classList.toggle('d-none', nombres.length === 0);
        }

        // Filtra la lista que ya está en memoria, sin volver a llamar a la API.
        function filtrarLibros() {
            const texto = document.getElementById('inputBuscar').value.toLowerCase().trim();
            const categoria = document.getElementById('selCategoria').value;
            // Si no hay texto ni categoría, muestra todos los libros.
            if (!texto && !categoria) {
                renderizarLibros(todosLosLibros);
                return;
            }
            // Pasa el filtro si el texto aparece en título, autor o ISBN, y si la categoría coincide.
            const filtrados = todosLosLibros.filter(libro => {
                const titulo = (libro.titulo || libro.nombre || '').toLowerCase();
                const autor = (libro.autores || libro.autor || '').toLowerCase();
                const isbn = (libro.isbn || libro.codigo_isbn_issn || libro.codigo_barras || '').toLowerCase();
                const coincideTexto = !texto || titulo.includes(texto) || autor.includes(texto) || isbn.includes(texto);
                const coincideCategoria = !categoria || libro.categoria === categoria;
                return coincideTexto && coincideCategoria;
            });
            renderizarLibros(filtrados);
        }

        // Lista de espera para libros agotados (RF11)
        // Envía la acción de lista de espera. accion puede ser reservar (entrar) o cancelar (salir).
        async function reservarMaterial(idMaterial, titulo, accion) {
            try {
                const resp = await fetch(window.SEMSAD_API + '/reservar_material_sirve_para_lista_de_espera.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ id_material: idMaterial, accion: accion || 'reservar' })
                });
                const res = await resp.json();
                // Muestra el mensaje del servidor: verde si salió bien, rojo si no.
                SEMSAD.toast(res.mensaje || 'No se pudo completar la operación.', res.status === 'success' ? 'success' : 'error');
                // Si la sesión expiró, regresa al login después de 2,5 segundos.
                if (res.codigo === 'sin_sesion') { setTimeout(() => { window.location.href = '../login/index.html'; }, 2500); return; }
                // Si salió bien, recarga el catálogo para ver el nuevo estado.
                if (res.status === 'success') cargarCatalogo();
            } catch (e) {
                SEMSAD.toast('Error de conexión con el servidor.', 'error');
            }
        }

        // Renovación de préstamos (RF10)
        async function renovarPrestamo(idPrestamo) {
            // Pide confirmación antes de renovar.
            if (!confirm('¿Quieres renovar este préstamo por 7 días más?')) return;
            try {
                // Llamada POST para ampliar el préstamo 7 días más.
                const resp = await fetch(window.SEMSAD_API + '/renovar_prestamo_sirve_para_ampliar_7_dias.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ id_prestamo: idPrestamo })
                });
                const res = await resp.json();
                SEMSAD.toast(res.mensaje || 'No se pudo renovar.', res.status === 'success' ? 'success' : 'error');
                // Si salió bien, recarga el historial para mostrar la nueva fecha límite.
                if (res.status === 'success') cargarMisPrestamos();
            } catch (e) {
                SEMSAD.toast('Error de conexión con el servidor.', 'error');
            }
        }
    </script>
