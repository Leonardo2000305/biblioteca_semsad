<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Estudiantes - Biblioteca SEMSAD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #2563eb; --bg-light: #f8fafc; }
        body { background-color: var(--bg-light); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 100vh; }
        .navbar-custom { background-color: #0f172a; }
        .hero-section { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; padding: 40px 20px; border-radius: 16px; margin-bottom: 30px; }
        .book-card { border: none; border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .extra-small { font-size: 12px; }
    </style>
</head>
<body>

    <!-- NAVBAR PRINCIPAL -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-book-open text-primary"></i>
                <span>BIBLIOTECA SEMSAD</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-info btn-sm fw-bold me-1" data-bs-toggle="modal" data-bs-target="#modalMisPrestamos" onclick="cargarMisPrestamos()">
                    <i class="fa-solid fa-clock-rotate-left me-1"></i>Mis Préstamos
                </button>
                <button class="btn btn-outline-light btn-sm fw-bold me-2" data-bs-toggle="modal" data-bs-target="#modalPerfil" onclick="cargarPerfil()">
                    <i class="fa-solid fa-user-pen me-1"></i>Mi Perfil
                </button>
                <span class="badge bg-primary px-3 py-2 fs-6 shadow-sm" id="badgeUsuario">
                    <i class="fa-solid fa-user-graduate me-1"></i><span id="nombreUsuarioHeader">Estudiante</span>
                </span>
                <a href="../login/index.html" onclick="SEMSAD.cerrarSesion(event)" class="btn btn-outline-light btn-sm fw-bold">
                    <i class="fa-solid fa-right-from-bracket me-1"></i>Salir
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container my-4">
        <!-- HERO / BUSCADOR -->
        <div class="hero-section text-center shadow">
            <h2 class="fw-bold mb-2">Bienvenido al Catálogo Digital</h2>
            <p class="text-light opacity-75 mb-4">Busca libros disponibles en la biblioteca institucional</p>
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-white border-0 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="inputBuscar" class="form-control border-0 px-3" placeholder="Buscar por título, autor o código..." onkeyup="filtrarLibros()">
                    </div>
                </div>
            </div>
        </div>

        <!-- CATÁLOGO DE LIBROS -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold text-dark mb-0"><i class="fa-solid fa-books text-primary me-2"></i>Libros Disponibles</h4>
            <button class="btn btn-sm btn-outline-primary fw-semibold" onclick="cargarCatalogo()">
                <i class="fa-solid fa-rotate me-1"></i>Actualizar
            </button>
        </div>

        <div class="row g-4" id="contenedorLibros"></div>
    </div>

    <!-- MODAL MI PERFIL -->
    <div class="modal fade" id="modalPerfil" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-user-pen text-primary me-2"></i>Mi Perfil</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <form id="formMiPerfil">
                    <div class="modal-body">
                        <div id="notaPerfilMigracion" class="alert alert-warning d-none small"></div>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label fw-bold" for="perfilNombres">Nombres *</label><input class="form-control" id="perfilNombres" maxlength="100" required></div>
                            <div class="col-md-6"><label class="form-label fw-bold" for="perfilApellidos">Apellidos *</label><input class="form-control" id="perfilApellidos" maxlength="100" required></div>
                            <div class="col-md-6"><label class="form-label fw-bold" for="perfilCorreo">Correo institucional</label><input class="form-control" id="perfilCorreo" readonly></div>
                            <div class="col-md-6"><label class="form-label fw-bold" for="perfilCodigo">CI / Código institucional</label><input class="form-control" id="perfilCodigo" readonly></div>
                            <div class="col-md-6"><label class="form-label fw-bold" for="perfilTelefono">Teléfono</label><input class="form-control" id="perfilTelefono" maxlength="50"></div>
                            <div class="col-md-6"><label class="form-label fw-bold" for="perfilCarrera">Carrera / Programa</label><input class="form-control" id="perfilCarrera" maxlength="120" placeholder="Carrera o programa académico"></div>
                            <div class="col-md-8"><label class="form-label fw-bold" for="perfilFoto">URL de fotografía (opcional)</label><input class="form-control" id="perfilFoto" maxlength="500" type="url" placeholder="https://..."></div>
                            <div class="col-md-4 d-flex align-items-end"><img id="perfilFotoPreview" src="" alt="Vista previa de fotografía" class="rounded border d-none" style="max-width:70px;max-height:70px;object-fit:cover"></div>
                        </div>
                        <div class="small text-muted mt-3" id="perfilUltimoAcceso">Último acceso: No disponible</div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button type="submit" class="btn btn-primary fw-bold"><i class="fa-solid fa-floppy-disk me-1"></i>Guardar perfil</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL MIS PRÉSTAMOS -->
    <div class="modal fade" id="modalMisPrestamos" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-bookmark text-primary me-2"></i>Mi Historial de Préstamos</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Libro</th>
                                    <th>Fecha Solicitud</th>
                                    <th>Fecha Límite</th>
                                    <th>Estado</th>
                                    <th class="no-print">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tablaMisPrestamosBody">
                                <tr><td colspan="5" class="text-center py-4">Cargando tus préstamos...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script>
        let todosLosLibros = [];

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('formMiPerfil')?.addEventListener('submit', guardarMiPerfil);
            document.getElementById('perfilFoto')?.addEventListener('input', actualizarVistaPreviaPerfil);
            iniciarVistaEstudiante();
        });

        async function iniciarVistaEstudiante() {
            try {
                // La sesión del servidor es la fuente de verdad. localStorage solo guarda datos para la interfaz.
                const resp = await fetch(window.SEMSAD_API + '/verificar_sesion.php', {
                    credentials: 'include',
                    cache: 'no-store'
                });
                const data = await resp.json();
                if (data.status !== 'success' || !data.sesion_activa || !data.usuario) {
                    localStorage.removeItem('semsad_user');
                    alert('Tu sesión no está activa. Inicia sesión nuevamente para entrar a la biblioteca.');
                    window.location.replace('../login/index.html');
                    return;
                }
                const u = data.usuario;
                if (['Administrador', 'Bibliotecario'].includes(u.rol)) {
                    window.location.replace('./admin.html');
                    return;
                }
                localStorage.setItem('semsad_user', JSON.stringify({
                    id: u.id_usuario,
                    name: u.nombreCompleto || u.nombre,
                    role: u.rol,
                    ci: u.ci,
                    correo: u.correo,
                    nombres: u.nombres,
                    apellidos: u.apellidos
                }));
                document.getElementById('nombreUsuarioHeader').innerText = u.nombreCompleto || u.nombre || u.correo;
                await cargarCatalogo();
            } catch (error) {
                console.error('No se pudo verificar la sesión:', error);
                document.getElementById('contenedorLibros').innerHTML = '<div class="col-12 text-center py-5"><i class="fa-solid fa-circle-exclamation fa-3x text-danger mb-3"></i><p class="text-danger fs-5">No se pudo verificar la sesión con el servidor. Comprueba tu conexión e inténtalo de nuevo.</p><a class="btn btn-outline-primary" href="../login/index.html">Volver al inicio de sesión</a></div>';
            }
        }

        function obtenerUsuarioLogueado() {
            function extraerUser(candidate) {
                if (!candidate) return null;
                if (typeof candidate === 'string') {
                    try { candidate = JSON.parse(candidate); } catch(e) { return null; }
                }
                if (typeof candidate !== 'object' || candidate === null) return null;

                let obj = candidate.usuario || candidate.user || candidate.datos || candidate.data || candidate;
                if (obj.usuario) obj = obj.usuario;
                if (obj.user) obj = obj.user;

                const id = obj.id_usuario || obj.id || obj.usuario_id || obj.user_id || 0;
                const correo = obj.correo || obj.email || obj.userCorreo || obj.correo_electronico || '';
                const nombres = obj.nombres || obj.nombre || '';
                const apellidos = obj.apellidos || obj.apellido || '';

                if (parseInt(id) > 0 || (typeof correo === 'string' && correo.trim().includes('@'))) {
                    return {
                        id_usuario: parseInt(id) || 0,
                        correo: String(correo).trim(),
                        nombres: String(nombres).trim(),
                        apellidos: String(apellidos).trim(),
                        nombreCompleto: (String(nombres) + ' ' + String(apellidos)).trim() || String(correo).trim()
                    };
                }
                return null;
            }

            if (typeof SEMSAD !== 'undefined') {
                if (typeof SEMSAD.obtenerUsuario === 'function') {
                    const res = extraerUser(SEMSAD.obtenerUsuario());
                    if (res) return res;
                }
                if (typeof SEMSAD.obtenerSesion === 'function') {
                    const res = extraerUser(SEMSAD.obtenerSesion());
                    if (res) return res;
                }
            }

            const storages = [localStorage, sessionStorage];
            const keys = ['semsad_sesion', 'semsad_usuario', 'usuario', 'sesion', 'semsad_user', 'user', 'userData', 'datos'];
            
            for (let store of storages) {
                for (let k of keys) {
                    try {
                        const item = store.getItem(k);
                        const res = extraerUser(item);
                        if (res) return res;
                    } catch(e) {}
                }
            }

            for (let store of storages) {
                for (let i = 0; i < store.length; i++) {
                    try {
                        const key = store.key(i);
                        const item = store.getItem(key);
                        const res = extraerUser(item);
                        if (res) return res;
                    } catch(e) {}
                }
            }

            return null;
        }

        async function cargarCatalogo() {
            // La identidad se valida por cookie/sesión en el backend; no enviar el ID desde el navegador.

            const contenedor = document.getElementById('contenedorLibros');
            contenedor.innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="fa-solid fa-spinner fa-spin fa-2xl text-primary mb-3"></i>
                    <p class="text-muted fw-semibold">Cargando catálogo de libros...</p>
                </div>`;

            try {
                const resp = await fetch(window.SEMSAD_API + '/obtener_libros.php', { credentials: 'include', cache: 'no-store' });
                const res = await resp.json();

                const listaLibros = res.libros || res.data || res.datos || [];

                if (res.status === 'success' && listaLibros.length > 0) {
                    todosLosLibros = listaLibros;
                    renderizarLibros(todosLosLibros);
                } else {
                    contenedor.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fa-solid fa-book-bookmark fa-3x text-muted mb-3"></i>
                            <p class="text-muted fs-5">No hay libros disponibles en este momento.</p>
                        </div>`;
                }
            } catch (e) {
                console.error("Error en cargarCatalogo:", e);
                contenedor.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fa-solid fa-circle-exclamation fa-3x text-danger mb-3"></i>
                        <p class="text-danger fs-5">Error al conectar con el servidor para obtener los libros.</p>
                    </div>`;
            }
        }

        function renderizarLibros(lista) {
            const contenedor = document.getElementById('contenedorLibros');
            if (!lista || lista.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-12 text-center py-4">
                        <p class="text-muted fs-5">No se encontraron libros que coincidan con la búsqueda.</p>
                    </div>`;
                return;
            }

            contenedor.innerHTML = '';
            lista.forEach(libro => {
                const idMaterial = libro.id_material || libro.id;
                const titulo = libro.titulo || libro.nombre || 'Sin título';
                const isbn = libro.isbn || libro.codigo_isbn_issn || libro.codigo_barras || 'Código S/N';
                const anio = libro.agno_publicacion || libro.año_publicacion || libro.anio || libro.year || 'N/A';
                const autor = libro.autores || libro.autor || 'Autor no especificado';
                
                const stockDisponible = (libro.stock_disponible !== undefined) ? parseInt(libro.stock_disponible) : parseInt(libro.disponible || 0);
                const tengoPrestamo = libro.tengo_prestamo_activo === true || libro.reservado_por_mi === true;
                const tengoReserva = libro.tengo_reserva_pendiente === true;
                const hayReservasPendientes = libro.hay_reservas_pendientes === true;
                let badgeHTML = '';
                let botonHTML = '';

                if (tengoPrestamo) {
                    badgeHTML = `<span class="badge bg-warning text-dark mb-2"><i class="fa-solid fa-bookmark me-1"></i>Préstamo activo</span>`;
                    botonHTML = `<button class="btn btn-warning text-dark w-100 fw-bold btn-sm mt-2" disabled><i class="fa-solid fa-check-double me-1"></i> LIBRO EN TU PODER</button>`;
                } else if (tengoReserva) {
                    const posicion = Number(libro.prioridad_reserva || 0);
                    badgeHTML = `<span class="badge bg-info text-dark mb-2"><i class="fa-solid fa-list-ol me-1"></i>En lista de espera · Posición ${posicion}</span>`;
                    botonHTML = `<button class="btn btn-outline-danger w-100 fw-bold btn-sm mt-2" onclick="cancelarReserva(${Number(libro.id_reserva_pendiente) || 0})"><i class="fa-solid fa-xmark me-1"></i> Cancelar reserva</button>`;
                } else if (stockDisponible > 0 && !hayReservasPendientes) {
                    badgeHTML = `<span class="badge bg-success mb-2"><i class="fa-solid fa-circle-check me-1"></i>Disponible (${stockDisponible})</span>`;
                    botonHTML = `<button class="btn btn-outline-primary w-100 fw-bold btn-sm mt-2" onclick="solicitarPrestamo(${idMaterial})"><i class="fa-solid fa-hand-holding-hand me-1"></i> Solicitar Préstamo</button>`;
                } else {
                    badgeHTML = hayReservasPendientes
                        ? `<span class="badge bg-warning text-dark mb-2"><i class="fa-solid fa-clock me-1"></i>En cola de reserva</span>`
                        : `<span class="badge bg-danger mb-2"><i class="fa-solid fa-circle-xmark me-1"></i>Sin copias disponibles</span>`;
                    botonHTML = `<button class="btn btn-outline-primary w-100 fw-bold btn-sm mt-2" onclick="solicitarReserva(${idMaterial})"><i class="fa-solid fa-bookmark me-1"></i> Unirme a lista de espera</button>`;
                }

                contenedor.innerHTML += `
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="card book-card h-100 shadow-sm p-3 bg-white">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <div>
                                    ${badgeHTML}
                                    <h5 class="fw-bold text-dark mb-1">${SEMSAD.esc(titulo)}</h5>
                                    <p class="text-muted small mb-2"><i class="fa-solid fa-user-pen me-1"></i>${SEMSAD.esc(autor)}</p>
                                    <p class="text-secondary extra-small mb-3"><i class="fa-solid fa-barcode me-1"></i>ISBN: ${SEMSAD.esc(isbn)} | Año: ${SEMSAD.esc(anio)}</p>
                                </div>
                                ${botonHTML}
                            </div>
                        </div>
                    </div>`;
            });
        }

        async function solicitarPrestamo(idMaterial) {
            const userObj = obtenerUsuarioLogueado();
            const libro = todosLosLibros.find(l => Number(l.id_material || l.id) === Number(idMaterial));
            const tituloLibro = libro ? (libro.titulo || libro.nombre || 'este libro') : 'este libro';
            if (!userObj || !userObj.id_usuario) {
                alert('No se detectó tu sesión activa. Inicia sesión nuevamente.');
                window.location.href = '../login/index.html';
                return;
            }
            const nombreSolicitante = userObj.nombreCompleto || userObj.name || userObj.correo || 'tu cuenta';
            if (!confirm(`¿Confirmas que deseas solicitar el préstamo de "${tituloLibro}" a nombre de ${nombreSolicitante} por 7 días?`)) return;

            try {
                const resp = await fetch(window.SEMSAD_API + '/registrar_prestamo.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ id_material: Number(idMaterial) })
                });

                const res = await resp.json();

                if (res.status === 'success') {
                    if (typeof SEMSAD !== 'undefined' && SEMSAD.toast) {
                        SEMSAD.toast(res.mensaje, 'success');
                    } else {
                        alert(res.mensaje);
                    }
                    cargarCatalogo();
                } else {
                    if (typeof SEMSAD !== 'undefined' && SEMSAD.toast) {
                        SEMSAD.toast(res.mensaje || 'Error al procesar el préstamo.', 'error');
                    } else {
                        alert(res.mensaje || 'Error al procesar el préstamo.');
                    }
                }
            } catch (e) {
                console.error("Error al solicitar préstamo:", e);
                alert("Error de conexión al procesar la solicitud de préstamo.");
            }
        }

        async function solicitarReserva(idMaterial) {
            const libro = todosLosLibros.find(l => Number(l.id_material || l.id) === Number(idMaterial));
            const titulo = libro ? (libro.titulo || libro.nombre || 'este libro') : 'este libro';
            if (!confirm('¿Deseas unirte a la lista de espera para "' + titulo + '"?')) return;
            try {
                const resp = await fetch(window.SEMSAD_API + '/reservar_material.php', {
                    method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ id_material: Number(idMaterial) })
                });
                const res = await resp.json();
                if (res.status === 'success') {
                    SEMSAD.toast(res.mensaje || 'Te añadimos a la lista de espera.', 'success');
                    await cargarCatalogo();
                } else {
                    SEMSAD.toast(res.mensaje || 'No se pudo crear la reserva.', 'error');
                }
            } catch (e) {
                console.error('Error al reservar:', e);
                SEMSAD.toast('No se pudo conectar con el servidor para reservar.', 'error');
            }
        }

        async function cancelarReserva(idReserva) {
            if (!Number(idReserva) || !confirm('¿Cancelar tu reserva pendiente?')) return;
            try {
                const resp = await fetch(window.SEMSAD_API + '/cancelar_reserva.php', {
                    method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ id_reserva: Number(idReserva) })
                });
                const res = await resp.json();
                if (res.status === 'success') {
                    SEMSAD.toast(res.mensaje || 'Reserva cancelada.', 'success');
                    await cargarCatalogo();
                } else {
                    SEMSAD.toast(res.mensaje || 'No se pudo cancelar la reserva.', 'error');
                }
            } catch (e) {
                console.error('Error al cancelar reserva:', e);
                SEMSAD.toast('No se pudo conectar con el servidor.', 'error');
            }
        }

        async function cargarPerfil() {
            const warning = document.getElementById('notaPerfilMigracion');
            try {
                const resp = await fetch(window.SEMSAD_API + '/obtener_perfil.php', { credentials: 'include', cache: 'no-store' });
                const res = await resp.json();
                if (res.status !== 'success' || !res.perfil) { SEMSAD.toast(res.mensaje || 'No se pudo consultar tu perfil.', 'error'); return; }
                const p = res.perfil;
                document.getElementById('perfilNombres').value = p.nombres || '';
                document.getElementById('perfilApellidos').value = p.apellidos || '';
                document.getElementById('perfilCorreo').value = p.correo || '';
                document.getElementById('perfilCodigo').value = p.codigo_empleado || '';
                document.getElementById('perfilTelefono').value = p.telefono || '';
                document.getElementById('perfilCarrera').value = p.carrera || '';
                document.getElementById('perfilFoto').value = p.fotografia || '';
                document.getElementById('perfilUltimoAcceso').textContent = 'Último acceso: ' + (p.ultimo_acceso || 'No disponible en la estructura actual de la base de datos');
                const avanzado = p.campos_perfil_avanzado_disponibles === true;
                document.getElementById('perfilCarrera').disabled = !avanzado;
                document.getElementById('perfilFoto').disabled = !avanzado;
                if (!avanzado) {
                    warning.textContent = 'La base de datos aún no tiene campos para carrera y fotografía. Se pueden habilitar mediante migracion_opcional_reservas_multas.sql, después de hacer copia de seguridad y revisar phpMyAdmin.';
                    warning.classList.remove('d-none');
                } else { warning.classList.add('d-none'); }
                actualizarVistaPreviaPerfil();
            } catch (e) {
                console.error('Error cargando perfil:', e);
                SEMSAD.toast('No se pudo conectar con el servidor para cargar tu perfil.', 'error');
            }
        }

        function actualizarVistaPreviaPerfil() {
            const img = document.getElementById('perfilFotoPreview');
            const url = (document.getElementById('perfilFoto')?.value || '').trim();
            if (url && /^https?:\/\//i.test(url)) { img.src = url; img.classList.remove('d-none'); }
            else { img.removeAttribute('src'); img.classList.add('d-none'); }
        }

        async function guardarMiPerfil(event) {
            event.preventDefault();
            const data = {
                nombres: document.getElementById('perfilNombres').value.trim(),
                apellidos: document.getElementById('perfilApellidos').value.trim(),
                telefono: document.getElementById('perfilTelefono').value.trim(),
                carrera: document.getElementById('perfilCarrera').value.trim(),
                fotografia: document.getElementById('perfilFoto').value.trim()
            };
            try {
                const resp = await fetch(window.SEMSAD_API + '/actualizar_perfil.php', {
                    method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(data)
                });
                const res = await resp.json();
                if (res.status === 'success') {
                    const current = SEMSAD.getUser() || {};
                    current.name = (data.nombres + ' ' + data.apellidos).trim();
                    current.nombres = data.nombres; current.apellidos = data.apellidos; current.telefono = data.telefono;
                    if (res.perfil && res.perfil.carrera) current.carrera = res.perfil.carrera;
                    SEMSAD.setUser(current);
                    document.getElementById('nombreUsuarioHeader').textContent = current.name;
                    SEMSAD.toast(res.mensaje || 'Perfil actualizado.', 'success');
                    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPerfil')).hide();
                } else { SEMSAD.toast(res.mensaje || 'No se pudo actualizar el perfil.', 'error'); }
            } catch (e) {
                console.error('Error actualizando perfil:', e);
                SEMSAD.toast('Error de conexión al actualizar el perfil.', 'error');
            }
        }
        async function cargarMisPrestamos() {
            const userObj = obtenerUsuarioLogueado();
            const tbody = document.getElementById('tablaMisPrestamosBody');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4"><i class="fa-solid fa-spinner fa-spin me-2 text-primary"></i>Cargando tus préstamos...</td></tr>';
            if (!userObj) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Inicia sesión nuevamente para consultar tus préstamos.</td></tr>';
                return;
            }
            try {
                const resp = await fetch(window.SEMSAD_API + '/mis_prestamos.php', { credentials: 'include', cache: 'no-store' });
                const res = await resp.json();
                if (res.status === 'success' && (res.prestamos || []).length > 0) {
                    tbody.innerHTML = '';
                    res.prestamos.forEach(p => {
                        let badge = '<span class="badge bg-primary">Activo</span>';
                        if (p.estado === 'Devuelto') badge = '<span class="badge bg-success">Devuelto</span>';
                        if (p.estado === 'Vencido' || p.estado === 'Con Mora') badge = '<span class="badge bg-danger">Vencido (Con Mora)</span>';
                        if (p.estado === 'Reserva pendiente') badge = '<span class="badge bg-warning text-dark">Reserva pendiente</span>';
                        const accion = p.estado === 'Activo' && Number(p.id_prestamo) > 0
                            ? `<button class="btn btn-sm btn-outline-primary no-print" onclick="renovarPrestamo(${Number(p.id_prestamo)})"><i class="fa-solid fa-calendar-plus me-1"></i>Renovar</button>`
                            : '<span class="text-muted">—</span>';
                        tbody.innerHTML += `<tr>
                            <td class="fw-bold text-dark">${SEMSAD.esc(p.titulo)}</td>
                            <td class="text-muted small">${SEMSAD.esc(p.fecha_salida)}</td>
                            <td class="fw-bold text-primary">${SEMSAD.esc(p.fecha_limite)}</td>
                            <td>${badge}</td>
                            <td class="no-print">${accion}</td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No tienes registros de préstamos aún.</td></tr>';
                }
            } catch (e) {
                console.error('Error al consultar tus préstamos:', e);
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-danger">Error al consultar tus préstamos.</td></tr>';
            }
        }

        async function renovarPrestamo(idPrestamo) {
            if (!Number(idPrestamo) || !confirm('¿Solicitar la renovación de este préstamo? El sistema validará si cumples las reglas de renovación.')) return;
            try {
                const resp = await fetch(window.SEMSAD_API + '/renovar_prestamo.php', {
                    method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ id_prestamo: Number(idPrestamo) })
                });
                const res = await resp.json();
                if (res.status === 'success') {
                    SEMSAD.toast((res.mensaje || 'Renovación realizada.') + (res.fecha_limite ? ' Nueva fecha límite: ' + res.fecha_limite : ''), 'success');
                    await cargarMisPrestamos();
                    await cargarCatalogo();
                } else { SEMSAD.toast(res.mensaje || 'No se pudo renovar el préstamo.', 'error'); }
            } catch (e) {
                console.error('Error al renovar:', e);
                SEMSAD.toast('Error de conexión al renovar el préstamo.', 'error');
            }
        }
        function filtrarLibros() {
            const texto = document.getElementById('inputBuscar').value.toLowerCase().trim();
            if (!texto) {
                renderizarLibros(todosLosLibros);
                return;
            }
            const filtrados = todosLosLibros.filter(libro => {
                const titulo = (libro.titulo || libro.nombre || '').toLowerCase();
                const autor = (libro.autores || libro.autor || '').toLowerCase();
                const isbn = (libro.isbn || libro.codigo_isbn_issn || libro.codigo_barras || '').toLowerCase();
                return titulo.includes(texto) || autor.includes(texto) || isbn.includes(texto);
            });
            renderizarLibros(filtrados);
        }
    </script>
</body>
