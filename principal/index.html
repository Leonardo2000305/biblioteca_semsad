<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca SEMSAD - Catálogo de Estudiantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark p-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-book-bookmark me-2"></i>BIBLIOTECA SEMSAD</a>
            <div class="d-flex" id="userBadgeContainer">
                <!-- Se llena con app.js -->
            </div>
        </div>
    </nav>

    <main class="container my-4">

        <!-- Panel de Auditoría: Oculto por defecto (style="display: none;"). Solo se mostrará si la sesión activa es de Administrador -->
        <div class="card shadow-sm border-0 mb-4" id="seccionAuditoria" style="display: none;">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0 fw-bold text-dark">
                    <i class="fa-solid fa-shield-halved text-primary me-2"></i>
                    Auditoría de Seguridad: Intentos de Recuperación
                </h5>
                <button class="btn btn-sm btn-outline-secondary" onclick="cargarAuditoria()">
                    <i class="fa-solid fa-rotate-right me-1"></i> Actualizar
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Usuario / Correo Ingresado</th>
                                <th>Fecha y Hora</th>
                                <th>Estado</th>
                                <th>Dirección IP</th>
                            </tr>
                        </thead>
                        <tbody id="tablaAuditoriaBody">
                            <tr>
                                <td colspan="4" class="text-center text-muted py-3">Cargando registros de auditoría...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between mb-4">
            <h4>Catálogo de Libros (Datos de MySQL)</h4>
            <button class="btn btn-outline-primary" id="navLoansLink">Mis Préstamos <span id="navLoansBadge" class="badge bg-danger">0</span></button>
        </div>
        
        <div class="row mb-4">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar por título, autor o clasificación...">
            </div>
            <div class="col-md-6">
                <select id="categorySelect" class="form-select">
                    <option value="all">Todas las Categorías</option>
                    <option value="software">Sistemas e Informática</option>
                    <option value="telecom">Telecomunicaciones</option>
                    <option value="db">Bases de Datos</option>
                </select>
            </div>
        </div>

        <div class="row g-4" id="catalogGrid">
            <!-- Renderizado por app.js -->
        </div>
    </main>

    <!-- Modal Reservas -->
    <div class="modal fade" id="reserveModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content">
            <div class="modal-body" id="reserveModalBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success" id="btnConfirmReserve">Reservar (Impacta DB)</button>
            </div>
        </div></div>
    </div>

    <!-- Modal Mis Préstamos -->
    <div class="modal fade" id="loansModal" tabindex="-1">
        <div class="modal-dialog modal-lg"><div class="modal-content">
            <div class="modal-header"><h5>Mis Préstamos Reales</h5></div>
            <div class="modal-body" id="loansListContainer"></div>
        </div></div>
    </div>
    
    <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="liveToast" class="toast"><div class="toast-body" id="toastMessageBody"></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>

    <!-- Control de visibilidad según el Rol -->
    <script>
        async function cargarAuditoria() {
            const tbody = document.getElementById('tablaAuditoriaBody');
            if (!tbody) return;

            try {
                const response = await fetch('../api/obtener_auditoria.php');
                const data = await response.json();

                if (data.status === 'success' && data.datos && data.datos.length > 0) {
                    tbody.innerHTML = data.datos.map(item => {
                        const esExito = item.estado === 'Exitoso';
                        const badgeClass = esExito ? 'bg-success' : 'bg-danger';
                        const icono = esExito ? 'fa-circle-check' : 'fa-circle-xmark';
                        
                        return `
                            <tr>
                                <td><strong>${item.correo_ingresado}</strong></td>
                                <td><i class="fa-regular fa-clock text-muted me-1"></i>${item.fecha_formateada}</td>
                                <td>
                                    <span class="badge ${badgeClass} p-2">
                                        <i class="fa-solid ${icono} me-1"></i>${item.estado}
                                    </span>
                                </td>
                                <td><code>${item.ip_origen || 'Desconocida'}</code></td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="text-center text-muted py-3">
                                No hay registros de intentos de recuperación por el momento.
                            </td>
                        </tr>
                    `;
                }
            } catch (err) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center text-danger py-3">
                            Error de conexión al cargar la auditoría.
                        </td>
                    </tr>
                `;
            }
        }

        async function verificarRolYMostrarAuditoria() {
            const seccion = document.getElementById('seccionAuditoria');
            try {
                const res = await fetch('../api/verificar_sesion.php');
                const data = await res.json();

                // Validar si hay sesión activa y el rol es Administrador (o id_rol 1)
                if (data.status === 'success' && data.usuario) {
                    const rol = String(data.usuario.rol || data.usuario.id_rol || '').toLowerCase();
                    if (rol.includes('admin') || rol === '1') {
                        seccion.style.display = 'block';
                        cargarAuditoria();
                        return;
                    }
                }
                seccion.style.display = 'none';
            } catch (e) {
                seccion.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', verificarRolYMostrarAuditoria);
    </script>
</body>
</html>
